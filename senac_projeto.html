<style>
:root{
  --bg:#080b14; --bg-2:#0b0f1c;
  --panel:#101728; --panel-2:#0c1220; --border:#1c2740;
  --neon:#22d3ee; --neon-glow:rgba(34,211,238,.45);
  --blue:#2f6ff2; --blue-2:#3b82f6;
  --orange:#f97316; --orange-2:#fb923c;
  --text:#e6ecf7; --text-dim:#8b97b3; --text-dim-2:#647089;
}
*{box-sizing:border-box}
body{font-family:'Montserrat',ui-sans-serif,system-ui;background:
  radial-gradient(1100px 500px at 15% -10%, rgba(47,111,242,.14), transparent 60%),
  radial-gradient(900px 500px at 100% 0%, rgba(249,115,22,.10), transparent 55%),
  var(--bg);color:var(--text);min-height:100vh}
.scrollbar::-webkit-scrollbar{width:7px;height:7px}
.scrollbar::-webkit-scrollbar-thumb{background:#28344f;border-radius:99px}
input,select,button{outline:none;font-family:inherit}

.card{border:1px solid var(--border);background:var(--panel);border-radius:18px}
.field{width:100%;border:1px solid var(--border);border-radius:10px;padding:.65rem .75rem;background:var(--panel-2);color:var(--text)}
.field::placeholder{color:var(--text-dim-2)}
.field:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(34,211,238,.15)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:10px;padding:.62rem .9rem;font-weight:700;font-size:.875rem;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:white;box-shadow:0 4px 18px rgba(59,130,246,.35)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-outline-neon{background:transparent;border:1.5px solid var(--blue-2);color:#cfe0ff}
.btn-outline-neon:hover{background:rgba(59,130,246,.12)}
.btn-muted{background:#151d31;color:var(--text);border:1px solid var(--border)}
.btn-muted:hover{background:#1a2439}

.table th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim-2);padding:.75rem;text-align:left;border-bottom:1px solid var(--border)}
.table td{padding:.75rem;border-top:1px solid var(--border);color:var(--text)}
.table tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
.table tbody tr:hover{background:rgba(34,211,238,.06)}

.nav-item{display:flex;align-items:center;gap:.7rem;width:100%;padding:.68rem .8rem;border-radius:12px;color:var(--text-dim);font-weight:600;font-size:.9rem}
.nav-item:hover{background:#141d33;color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:white;box-shadow:0 6px 18px rgba(249,115,22,.35)}
.nav-item i{width:18px;height:18px;flex-shrink:0}

.hero-frame{
  position:relative;border-radius:24px;padding:1.4rem 2rem;
  background:linear-gradient(180deg,rgba(16,23,40,.95),rgba(9,13,24,.95));
  border:1.5px solid rgba(34,211,238,.55);
  box-shadow:0 0 0 1px rgba(34,211,238,.12),0 0 46px var(--neon-glow),0 14px 34px rgba(0,0,0,.45);
}
.hero-frame::before{
  content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(34,211,238,.6),rgba(59,130,246,0),rgba(249,115,22,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

.kpi-icon{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;border-radius:.7rem}

.dot-avatar{width:2.1rem;height:2.1rem;border-radius:9999px;background:linear-gradient(135deg,var(--blue-2),var(--neon));display:flex;align-items:center;justify-content:center;color:#04121c;font-weight:800;font-size:.8rem}

.sidebar-shell{background:linear-gradient(180deg,var(--bg-2),var(--bg));border-right:1px solid var(--border)}
</style>
</head>

<script>
/* ===================== ERP Gestão Comercial — lógica local (sem Firebase, sem persistência) ===================== */

const VENDEDORES_PADRAO = ["Almir","Bruno","Jefersson","João","Lucas","Paulo","Tiago"];
const MESES_PT = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const LOW_STOCK_THRESHOLD = 30;
const CREDENCIAIS = { usuario: "admin", senha: "admin" };

const $ = s => document.querySelector(s);
const money = v => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(v) || 0);
const dateBR = v => { const d = new Date(v); return isNaN(d) ? "—" : d.toLocaleDateString("pt-BR"); };
const dateTimeBR = v => { const d = new Date(v); return isNaN(d) ? "—" : d.toLocaleString("pt-BR"); };
const round2 = v => Math.round((Number(v) + Number.EPSILON) * 100) / 100;
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function renderIcons() { if (window.lucide) lucide.createIcons(); }
function toast(msg, type) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "fixed right-4 top-4 z-[100] max-w-sm rounded-xl px-4 py-3 text-sm font-semibold shadow-xl " + (type === "error" ? "bg-red-600 text-white" : "bg-slate-900 text-white");
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => t.classList.add("hidden"), 3200);
  t.classList.remove("hidden");
}

/* ---------- horário comercial aleatório (08:00–12:00 ou 14:00–18:00) ---------- */
function randomBusinessTime() {
  const janelas = [[8, 0, 12, 0], [14, 0, 18, 0]];
  const j = janelas[Math.floor(Math.random() * janelas.length)];
  const inicioMin = j[0] * 60 + j[1];
  const fimMin = j[2] * 60 + j[3];
  const totalMin = fimMin - inicioMin;
  const offset = Math.floor(Math.random() * totalMin);
  const totalComOffset = inicioMin + offset;
  return { hh: Math.floor(totalComOffset / 60), mm: totalComOffset % 60, ss: Math.floor(Math.random() * 60) };
}
/** Mantém a data (ano/mês/dia) recebida, mas substitui o horário por um horário comercial aleatório. */
function withRandomBusinessTime(dateLike) {
  const d = new Date(dateLike);
  const t = randomBusinessTime();
  d.setHours(t.hh, t.mm, t.ss, 0);
  return d.toISOString();
}

/* ---------- nome curto de produto (usado na coluna "Total produtos:") ---------- */
function shortName(nomeCompleto) {
  const i = nomeCompleto.indexOf(" (");
  return i === -1 ? nomeCompleto.trim() : nomeCompleto.slice(0, i).trim();
}

/* ---------- interpreta "3x Filtro de Óleo Lubrificante, 2x Bomba d'Água do Motor." ---------- */
function parseSaleItemsFromText(texto, products) {
  const itens = [];
  const naoEncontrados = [];
  const limpo = String(texto || "").trim().replace(/\.\s*$/, "");
  if (!limpo) return { itens, naoEncontrados };
  const partes = limpo.split(",").map(p => p.trim()).filter(Boolean);
  const lookup = new Map(products.map(p => [shortName(p.nome).toLowerCase(), p]));
  for (const parte of partes) {
    const m = parte.match(/^(\d+)\s*x\s+(.+)$/i);
    if (!m) { naoEncontrados.push(parte); continue; }
    const quantidade = parseInt(m[1], 10);
    const nomeDigitado = m[2].trim();
    const prod = lookup.get(nomeDigitado.toLowerCase());
    if (!prod) { naoEncontrados.push(parte); continue; }
    itens.push({ codigo: prod.codigo, nome: prod.nome, quantidade: quantidade, preco: prod.preco });
  }
  return { itens, naoEncontrados };
}

/* ---------- gera o texto "Total produtos:" a partir dos itens estruturados ---------- */
function generateProductsText(itens) {
  if (!itens.length) return "";
  return itens.map(i => (i.quantidade + "x " + shortName(i.nome))).join(", ") + ".";
}

/* ===================== estado ===================== */
const state = {
  page: "dashboard",
  products: [],
  sales: [],
  docs: [],
  user: null,
  charts: {}
};

function loadInitialData() {
  const products = structuredClone(INITIAL_DATA.products);
  const docs = structuredClone(INITIAL_DATA.docs);
  const sales = structuredClone(INITIAL_DATA.sales).map(s => {
    const parsed = parseSaleItemsFromText(s.totalProdutosTexto, products);
    if (parsed.naoEncontrados.length) console.warn("NF " + s.nota + ": itens nao reconhecidos:", parsed.naoEncontrados);
    return Object.assign({}, s, { itens: parsed.itens, emissao: withRandomBusinessTime(s.emissao), historica: true });
  });
  return { products: products, sales: sales, docs: docs };
}

function resetState(silent) {
  const fresh = loadInitialData();
  state.products = fresh.products;
  state.sales = fresh.sales;
  state.docs = fresh.docs;
  if (!silent) toast("Dados iniciais restaurados. Alterações da sessão foram descartadas.");
}

/* ===================== autenticação local ===================== */
function login(usuario, senha) {
  if (usuario === CREDENCIAIS.usuario && senha === CREDENCIAIS.senha) {
    state.user = { nome: usuario };
    return true;
  }
  return false;
}
function logout() { state.user = null; }

/* ===================== vendas ===================== */
function nextNota() {
  const max = state.sales.reduce((a, s) => Math.max(a, Number(s.nota) || 0), 1000);
  return max + 1;
}

function vendedoresConhecidos() {
  const set = new Set(VENDEDORES_PADRAO);
  state.sales.forEach(s => { if (s.vendedor) set.add(s.vendedor); });
  return [...set].sort((a, b) => a.localeCompare(b, "pt-BR"));
}

/** Agrega linhas do formulário (mesmo produto em mais de uma linha é somado). */
function aggregateFormRows(rows) {
  const map = new Map();
  for (const r of rows) {
    if (!r.codigo) continue;
    const atual = map.get(r.codigo) || { codigo: r.codigo, quantidade: 0 };
    atual.quantidade += r.quantidade;
    map.set(r.codigo, atual);
  }
  return [...map.values()];
}

function validateSale(input) {
  const nota = input.nota, vendedor = input.vendedor, itensBrutos = input.itensBrutos;
  const erros = [];
  if (!nota || !Number.isInteger(nota) || nota <= 0) erros.push("Informe um número de nota fiscal válido.");
  if (state.sales.some(s => Number(s.nota) === Number(nota))) erros.push("A nota fiscal " + nota + " já existe.");
  if (!vendedor || !vendedor.trim()) erros.push("Selecione ou informe o vendedor.");
  if (!itensBrutos.length) erros.push("Adicione ao menos um produto à venda.");

  const agregados = aggregateFormRows(itensBrutos);
  const itens = [];
  for (const a of agregados) {
    const prod = state.products.find(p => String(p.codigo) === String(a.codigo));
    if (!prod) { erros.push("Produto de código " + a.codigo + " não encontrado."); continue; }
    if (!Number.isInteger(a.quantidade) || a.quantidade <= 0) { erros.push("Quantidade inválida para " + prod.nome + "."); continue; }
    if (a.quantidade > prod.quantidade) {
      erros.push("Estoque insuficiente para " + prod.nome + ". Disponível: " + prod.quantidade + ", solicitado: " + a.quantidade + ".");
      continue;
    }
    itens.push({ codigo: prod.codigo, nome: prod.nome, quantidade: a.quantidade, preco: prod.preco });
  }
  return { erros: erros, itens: itens };
}

function calculateSaleTotal(itens) {
  return round2(itens.reduce((sum, i) => sum + i.quantidade * i.preco, 0));
}

function applyStockReduction(itens) {
  for (const i of itens) {
    const prod = state.products.find(p => String(p.codigo) === String(i.codigo));
    prod.quantidade -= i.quantidade;
  }
}

function createSale(input) {
  const nota = input.nota, vendedor = input.vendedor, itens = input.itens;
  const valor = calculateSaleTotal(itens);
  const sale = {
    nota: Number(nota),
    emissao: withRandomBusinessTime(new Date()),
    vendedor: vendedor.trim(),
    itens: itens,
    totalProdutosTexto: generateProductsText(itens),
    valor: valor,
    historica: false
  };
  applyStockReduction(itens);
  state.sales.push(sale);
  return sale;
}

function findSaleByNumber(nota) {
  return state.sales.find(s => String(s.nota) === String(nota).trim());
}

/* ===================== produtos ===================== */
function saveProduct(p, isEditing) {
  const codigo = Number(p.codigo);
  if (!codigo || codigo <= 0) return { ok: false, error: "Código inválido." };
  if (!p.nome || !p.nome.trim()) return { ok: false, error: "Informe o nome do produto." };
  if (!(p.quantidade >= 0) || !Number.isInteger(p.quantidade)) return { ok: false, error: "Quantidade inválida." };
  if (!(p.preco >= 0)) return { ok: false, error: "Preço inválido." };
  const existente = state.products.find(x => x.codigo === codigo);
  if (existente && !isEditing) return { ok: false, error: "Já existe um produto com o código " + codigo + "." };
  if (existente) Object.assign(existente, { nome: p.nome.trim(), quantidade: p.quantidade, preco: round2(p.preco) });
  else state.products.push({ codigo: codigo, nome: p.nome.trim(), quantidade: p.quantidade, preco: round2(p.preco) });
  return { ok: true };
}

/* ===================== documentos ===================== */
function saveDoc(d, isEditing) {
  const id = Number(d.id);
  if (!id || id <= 0) return { ok: false, error: "ID inválido." };
  if (!d.nome || !d.nome.trim()) return { ok: false, error: "Informe o nome do documento." };
  const existente = state.docs.find(x => x.id === id);
  if (existente && !isEditing) return { ok: false, error: "Já existe um documento com o ID " + id + "." };
  if (existente) Object.assign(existente, { nome: d.nome.trim(), tipo: d.tipo.trim(), emissao: d.emissao, status: d.status });
  else state.docs.push({ id: id, nome: d.nome.trim(), tipo: d.tipo.trim(), emissao: d.emissao, status: d.status });
  return { ok: true };
}

/* ===================== indicadores ===================== */
function kpis() {
  const fatur = state.sales.reduce((a, x) => a + Number(x.valor || 0), 0);
  const qtd = state.sales.length;
  const low = state.products.filter(p => Number(p.quantidade) <= LOW_STOCK_THRESHOLD).length;
  const items = state.products.reduce((a, p) => a + Number(p.quantidade || 0), 0);
  const pend = state.docs.filter(d => d.status === "Pendente").length;
  return { fatur: fatur, qtd: qtd, low: low, ticket: qtd ? fatur / qtd : 0, items: items, pend: pend };
}

function produtosMaisVendidos(sales, limit) {
  limit = limit || 8;
  const acc = new Map();
  sales.forEach(s => (s.itens || []).forEach(i => acc.set(i.nome, (acc.get(i.nome) || 0) + Number(i.quantidade || 0))));
  return [...acc.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit);
}

/* ===================== fechamento mensal ===================== */
function salesInMonth(monthStr) {
  const parts = monthStr.split("-").map(Number);
  const y = parts[0], m = parts[1];
  const start = new Date(y, m - 1, 1, 0, 0, 0, 0);
  const end = new Date(y, m, 0, 23, 59, 59, 999);
  return state.sales
    .filter(s => { const d = new Date(s.emissao); return d >= start && d <= end; })
    .sort((a, b) => new Date(a.emissao) - new Date(b.emissao));
}

function monthLabel(monthStr) {
  const parts = monthStr.split("-").map(Number);
  const y = parts[0], m = parts[1];
  const nome = MESES_PT[m - 1];
  return nome.charAt(0).toUpperCase() + nome.slice(1) + "/" + y;
}
function monthFileTag(monthStr) {
  const parts = monthStr.split("-").map(Number);
  const y = parts[0], m = parts[1];
  return MESES_PT[m - 1] + "_" + y;
}

<script>
/* ===================== Exportação XLSX estilizada (ExcelJS) — fechamento mensal ===================== */

const COR_TITULO = "FF2B4C6F";
const COR_HEADER_BG = "FF304C6F";
const COR_HEADER_TXT = "FFFFFFFF";
const FONTE = "Arial";
const FMT_MOEDA = '"R$" #,##0.00';
const FMT_DATA = "dd/mm/yyyy";
const FMT_DATAHORA = "dd/mm/yyyy, hh:mm";

function thinBorder() {
  return { top: { style: "thin", color: { argb: "FFCBD5E1" } }, left: { style: "thin", color: { argb: "FFCBD5E1" } }, bottom: { style: "thin", color: { argb: "FFCBD5E1" } }, right: { style: "thin", color: { argb: "FFCBD5E1" } } };
}
function doubleTopBorder() {
  return { top: { style: "double", color: { argb: "FF2B4C6F" } } };
}
/** Aplica uma borda a todas as colunas de colStart até colEnd na mesma linha (garante linha contínua mesmo com células mescladas). */
function applyBorderAcross(row, colStart, colEnd, borderObj) {
  for (let c = colStart; c <= colEnd; c++) {
    row.getCell(c).border = Object.assign({}, row.getCell(c).border, borderObj);
  }
}

function styleTitle(ws, ref, text) {
  ws.mergeCells(ref);
  const cell = ws.getCell(ref.split(":")[0]);
  cell.value = text;
  cell.font = { name: FONTE, size: 16, bold: true, color: { argb: COR_TITULO } };
  cell.alignment = { vertical: "center", horizontal: "center" };
}

/** startCol: coluna (1=A, 2=B...) onde o primeiro rótulo é escrito — precisa bater com as colunas reais dos dados. */
function styleHeaderRow(ws, row, startCol, labels) {
  labels.forEach((label, idx) => {
    const cell = row.getCell(startCol + idx);
    cell.value = label;
    cell.font = { name: FONTE, size: 11, bold: true, color: { argb: COR_HEADER_TXT } };
    cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: COR_HEADER_BG } };
    cell.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
  });
  row.commit();
}

function buildMenuSheet(wb, ctx) {
  const ws = wb.addWorksheet("MENU", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 3 }, { width: 32 }, { width: 22 }];
  styleTitle(ws, "B2:C2", "FECHAMENTO — " + ctx.label);
  ws.getCell("B3").value = "Período: " + ctx.periodoTexto;
  ws.getCell("B3").font = { name: FONTE, size: 10, italic: true, color: { argb: "FF64748B" } };

  const headerRow = ws.getRow(5);
  styleHeaderRow(ws, headerRow, 2, ["Indicador", "Valor"]);

  const linhas = [
    ["Faturamento do período", ctx.fatur, FMT_MOEDA],
    ["Quantidade de vendas", ctx.qtd, "#,##0"],
    ["Ticket médio", ctx.ticket, FMT_MOEDA],
    ["Total de itens vendidos", ctx.totalItensVendidos, "#,##0"],
    ["Produtos com estoque baixo (≤ " + LOW_STOCK_THRESHOLD + ")", ctx.low, "#,##0"]
  ];
  linhas.forEach((linha, i) => {
    const r = ws.getRow(6 + i);
    r.getCell(2).value = linha[0];
    r.getCell(2).font = { name: FONTE, size: 11, color: { argb: "FF334155" } };
    r.getCell(3).value = linha[1];
    r.getCell(3).numFmt = linha[2];
    r.getCell(3).font = { name: FONTE, size: 12, bold: true, color: { argb: COR_TITULO } };
    r.getCell(2).border = thinBorder();
    r.getCell(3).border = thinBorder();
  });
}

function buildFinanceiroSheet(wb, ctx) {
  const ws = wb.addWorksheet("Financeiro", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 3 }, { width: 12 }, { width: 20 }, { width: 16 }, { width: 60 }, { width: 16 }, { width: 3 }, { width: 22 }, { width: 14 } ];
  styleTitle(ws, "B2:F2", "CONTROLE FINANCEIRO — Fechamento " + ctx.label);

  const headerRow = ws.getRow(4);
  styleHeaderRow(ws, headerRow, 2, ["Nota", "Emissão", "Vendedor", "Total produtos:", "Valor"]);

  let r = 5;
  ctx.sales.forEach(s => {
    const row = ws.getRow(r);
    row.getCell(2).value = s.nota;
    row.getCell(3).value = new Date(s.emissao);
    row.getCell(3).numFmt = FMT_DATAHORA;
    row.getCell(4).value = s.vendedor;
    row.getCell(5).value = s.totalProdutosTexto;
    row.getCell(6).value = s.valor;
    row.getCell(6).numFmt = FMT_MOEDA;
    for (let c = 2; c <= 6; c++) {
      row.getCell(c).font = { name: FONTE, size: 10 };
      row.getCell(c).border = thinBorder();
      row.getCell(c).alignment = { vertical: "top", wrapText: c === 5 };
    }
    row.getCell(2).alignment = { horizontal: "center" };
    r++;
  });
  const totalRow = ws.getRow(r);
  const ultimaLinhaDados = r - 1;
  ws.mergeCells("B" + r + ":E" + r);
  totalRow.getCell(2).value = "Total do período:";
  totalRow.getCell(2).font = { name: FONTE, size: 11, bold: true };
  totalRow.getCell(6).value = { formula: "SUM(F5:F" + ultimaLinhaDados + ")", result: ctx.fatur };
  totalRow.getCell(6).numFmt = FMT_MOEDA;
  totalRow.getCell(6).font = { name: FONTE, size: 11, bold: true, color: { argb: COR_TITULO } };
  applyBorderAcross(totalRow, 2, 6, doubleTopBorder());

  // Painel "Consultar Nota Fiscal" — PROCV (VLOOKUP) dinâmico em função de I4
  ws.mergeCells("H2:I2");
  ws.getCell("H2").value = "CONSULTAR NOTA FISCAL:";
  ws.getCell("H2").font = { name: FONTE, size: 13, bold: true, color: { argb: COR_TITULO } };
  ws.getCell("H4").value = "Número da nota:";
  ws.getCell("H4").font = { name: FONTE, size: 10, bold: true };
  const exemplo = ctx.sales[0];
  if (exemplo) {
    const tabela = "B5:F" + ultimaLinhaDados;
    ws.getCell("I4").value = exemplo.nota;
    ws.getCell("I4").fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFF9DB" } };
    ws.getCell("I4").alignment = { horizontal: "center" };
    ["H5", "I5", "J5"].forEach((c, idx) => {
      ws.getCell(c).value = ["Emissão", "Vendedor", "Valor"][idx];
      ws.getCell(c).font = { name: FONTE, size: 10, bold: true, color: { argb: COR_HEADER_TXT } };
      ws.getCell(c).fill = { type: "pattern", pattern: "solid", fgColor: { argb: COR_HEADER_BG } };
      ws.getCell(c).alignment = { horizontal: "center" };
    });
    ws.getCell("H6").value = { formula: "VLOOKUP(I4," + tabela + ",2,FALSE)", result: new Date(exemplo.emissao) };
    ws.getCell("H6").numFmt = FMT_DATAHORA;
    ws.getCell("I6").value = { formula: "VLOOKUP(I4," + tabela + ",3,FALSE)", result: exemplo.vendedor };
    ws.getCell("J6").value = { formula: "VLOOKUP(I4," + tabela + ",5,FALSE)", result: exemplo.valor };
    ws.getCell("J6").numFmt = FMT_MOEDA;
    ["H4", "I4", "H6", "I6", "J6"].forEach(c => ws.getCell(c).border = thinBorder());
  }
}

function buildEstoqueSheet(wb, ctx) {
  const ws = wb.addWorksheet("Estoque", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 3 }, { width: 14 }, { width: 55 }, { width: 14 }, { width: 16 }, { width: 16 }];
  styleTitle(ws, "B2:F2", "CONTROLE DE ESTOQUE — situação em " + ctx.geradoEm);

  const headerRow = ws.getRow(4);
  styleHeaderRow(ws, headerRow, 2, ["Cód Produto", "Nome do Produto", "Quantidade", "Preço Unitário", "Valor Total"]);

  const produtosOrdenados = ctx.products.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  let r = 5;
  produtosOrdenados.forEach(p => {
    const row = ws.getRow(r);
    row.getCell(2).value = p.codigo;
    row.getCell(3).value = p.nome;
    row.getCell(4).value = p.quantidade;
    row.getCell(5).value = p.preco;
    row.getCell(5).numFmt = FMT_MOEDA;
    row.getCell(6).value = { formula: "D" + r + "*E" + r, result: round2(p.quantidade * p.preco) };
    row.getCell(6).numFmt = FMT_MOEDA;
    for (let c = 2; c <= 6; c++) { row.getCell(c).font = { name: FONTE, size: 10 }; row.getCell(c).border = thinBorder(); }
    row.getCell(2).alignment = { horizontal: "center" };
    row.getCell(4).alignment = { horizontal: "center" };
    if (p.quantidade <= LOW_STOCK_THRESHOLD) row.getCell(4).font = { name: FONTE, size: 10, bold: true, color: { argb: "FFB45309" } };
    r++;
  });
  const totalRow = ws.getRow(r);
  totalRow.getCell(2).value = "Total Geral em Estoque";
  totalRow.getCell(2).font = { name: FONTE, size: 11, bold: true };
  totalRow.getCell(4).value = { formula: "SUM(D5:D" + (r - 1) + ")", result: ctx.products.reduce((a, p) => a + p.quantidade, 0) };
  totalRow.getCell(6).value = { formula: "SUM(F5:F" + (r - 1) + ")", result: round2(ctx.products.reduce((a, p) => a + p.quantidade * p.preco, 0)) };
  totalRow.getCell(6).numFmt = FMT_MOEDA;
  applyBorderAcross(totalRow, 2, 6, doubleTopBorder());
  [2, 4, 6].forEach(c => { totalRow.getCell(c).font = { name: FONTE, size: 11, bold: true, color: { argb: COR_TITULO } }; });
}

function buildDocumentacaoSheet(wb, ctx) {
  const ws = wb.addWorksheet("Documentação", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 3 }, { width: 10 }, { width: 42 }, { width: 24 }, { width: 16 }, { width: 16 }];
  styleTitle(ws, "B2:F2", "CONTROLE DOCUMENTAL — situação em " + ctx.geradoEm);

  const headerRow = ws.getRow(4);
  styleHeaderRow(ws, headerRow, 2, ["ID Doc", "Nome do Documento", "Tipo", "Data de Emissão", "Status"]);

  let r = 5;
  ctx.docs.forEach(d => {
    const row = ws.getRow(r);
    row.getCell(2).value = d.id;
    row.getCell(3).value = d.nome;
    row.getCell(4).value = d.tipo;
    row.getCell(5).value = new Date(d.emissao);
    row.getCell(5).numFmt = FMT_DATA;
    row.getCell(6).value = d.status;
    for (let c = 2; c <= 6; c++) { row.getCell(c).font = { name: FONTE, size: 10 }; row.getCell(c).border = thinBorder(); row.getCell(c).alignment = { horizontal: c === 3 ? "left" : "center" }; }
    r++;
  });
}

async function exportStyledWorkbook(monthStr) {
  const salesPeriodo = salesInMonth(monthStr);
  if (!salesPeriodo.length) {
    toast("Não é possível gerar o fechamento: não há vendas registradas em " + monthLabel(monthStr) + ".", "error");
    return false;
  }
  const label = monthLabel(monthStr);
  const [y, m] = monthStr.split("-").map(Number);
  const start = new Date(y, m - 1, 1);
  const end = new Date(y, m, 0);
  const fatur = round2(salesPeriodo.reduce((a, s) => a + s.valor, 0));
  const totalItensVendidos = salesPeriodo.reduce((a, s) => a + s.itens.reduce((x, i) => x + i.quantidade, 0), 0);
  const low = state.products.filter(p => p.quantidade <= LOW_STOCK_THRESHOLD).length;

  const ctx = {
    label: label,
    periodoTexto: dateBR(start) + " — " + dateBR(end),
    geradoEm: dateTimeBR(new Date()),
    sales: salesPeriodo,
    products: state.products,
    docs: state.docs,
    fatur: fatur,
    qtd: salesPeriodo.length,
    ticket: round2(fatur / salesPeriodo.length),
    totalItensVendidos: totalItensVendidos,
    low: low
  };

  const wb = new ExcelJS.Workbook();
  wb.creator = "ERP Gestão Comercial";
  wb.created = new Date();
  buildMenuSheet(wb, ctx);
  buildFinanceiroSheet(wb, ctx);
  buildEstoqueSheet(wb, ctx);
  buildDocumentacaoSheet(wb, ctx);

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "fechamento_" + monthFileTag(monthStr) + ".xlsx";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Fechamento de " + label + " gerado com sucesso.");
  return true;
}

<script>
/* ===================== UI: telas, modais, gráficos, eventos ===================== */

}

function render() {

    case "sales": renderSales(); break;

    case "docs": renderDocs(); break;

/* ---------------- Dashboard ---------------- */
const CHART_PALETTE = ["#3b82f6", "#22d3ee", "#f97316", "#facc15", "#14b8a6", "#a78bfa", "#fb7185", "#34d399"];

function kpiCard(title, val, icon, color, bg) {

function destroyCharts() { Object.values(state.charts).forEach(c => c && c.destroy()); state.charts = {}; }

    '<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">' +

    kpiCard("Ticket Médio", money(k.ticket), "receipt", "#22d3ee", "rgba(34,211,238,.16)") +
    "</div>" +
    '<div class="mt-4 grid gap-4 xl:grid-cols-3">' +
    '<div class="card p-4 xl:col-span-2"><div class="mb-3 font-bold text-white">Evolução do Faturamento</div><div class="h-72"><canvas id="salesEvolution"></canvas></div></div>' +
    '<div class="card p-4"><div class="mb-3 font-bold text-white">Vendas por Vendedor</div><div class="h-72"><canvas id="sellerChart"></canvas></div></div>' +
    "</div>" +
    '<div class="mt-4 grid gap-4 xl:grid-cols-3">' +
    '<div class="card p-4"><div class="mb-3 font-bold text-white">Produtos mais vendidos</div><div class="flex flex-col items-center gap-4 sm:flex-row"><div class="h-52 w-52 flex-shrink-0"><canvas id="productChart"></canvas></div><div id="productLegend" class="w-full space-y-1.5 text-xs"></div></div></div>' +
    '<div class="card p-4 xl:col-span-2"><div class="mb-3 flex items-center justify-between"><div class="font-bold text-white">Últimas vendas</div><button class="btn btn-muted" data-go="sales">Ver todas</button></div>' +
    salesTable(state.sales.slice().sort((a, b) => new Date(b.emissao) - new Date(a.emissao)).slice(0, 8)) +
    "</div></div>";
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { state.page = b.dataset.go; render(); });
  drawCharts();
}

function drawCharts() {
  destroyCharts();
  Chart.defaults.color = "#8b97b3";
  Chart.defaults.borderColor = "rgba(255,255,255,.06)";
  Chart.defaults.font.family = "Montserrat, ui-sans-serif, system-ui";
  const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };

  const sellers = {};
  state.sales.forEach(s => sellers[s.vendedor] = (sellers[s.vendedor] || 0) + Number(s.valor || 0));
  const sellerLabels = Object.keys(sellers);
  state.charts.seller = new Chart($("#sellerChart"), {
    type: "bar",
    data: { labels: sellerLabels, datasets: [{ data: Object.values(sellers), borderRadius: 8, backgroundColor: sellerLabels.map((_, i) => CHART_PALETTE[i % CHART_PALETTE.length]) }] },
    options: Object.assign({}, opts, { scales: { y: { beginAtZero: true, grid: { color: "rgba(255,255,255,.06)" } }, x: { grid: { display: false } } } })
  });

  const months = {};
  state.sales.forEach(s => { const d = new Date(s.emissao), key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); months[key] = (months[key] || 0) + Number(s.valor || 0); });
  const labels = Object.keys(months).sort();
  state.charts.evo = new Chart($("#salesEvolution"), {
    type: "line",
    data: { labels: labels, datasets: [{ label: "Faturamento", data: labels.map(x => months[x]), tension: .35, fill: true, borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,.14)", pointBackgroundColor: "#f97316", pointBorderColor: "#f97316", pointRadius: 5, pointHoverRadius: 7, borderWidth: 3 }] },
    options: Object.assign({}, opts, { scales: { y: { beginAtZero: true, grid: { color: "rgba(255,255,255,.06)" } }, x: { grid: { display: false } } } })
  });

  let top = produtosMaisVendidos(state.sales, 8);
  if (!top.length) top = state.products.slice().sort((a, b) => b.quantidade - a.quantidade).slice(0, 8).map(p => [p.nome, p.quantidade]);
  const donutColors = top.map((_, i) => CHART_PALETTE[i % CHART_PALETTE.length]);
  state.charts.product = new Chart($("#productChart"), {
    type: "doughnut",
    data: { labels: top.map(x => shortName(x[0])), datasets: [{ data: top.map(x => x[1]), backgroundColor: donutColors, borderColor: "#101728", borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
  $("#productLegend").innerHTML = top.map((x, i) =>
    '<div class="flex items-center gap-2"><span class="h-2.5 w-2.5 flex-shrink-0 rounded-sm" style="background:' + donutColors[i] + '"></span><span class="truncate" style="color:var(--text-dim)">' + esc(shortName(x[0])) + "</span></div>"
  ).join("");
}

function salesTable(rows) {
  return '<div class="overflow-auto scrollbar"><table class="table w-full text-sm"><thead><tr><th>Nota</th><th>Emissão</th><th>Vendedor</th><th class="text-right">Valor</th></tr></thead><tbody>' +
    rows.map(s => '<tr class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60" data-nota="' + esc(s.nota) + '"><td class="font-bold">#' + esc(s.nota) + "</td><td>" + dateTimeBR(s.emissao) + "</td><td>" + esc(s.vendedor) + '</td><td class="text-right font-semibold">' + money(s.valor) + "</td></tr>").join("") +

function nomeVendedorSelecionado() {

}

function addSaleItem() {
  const wrap = $("#saleItems"), div = document.createElement("div");
  div.className = "sale-item mb-3 rounded-xl border border-slate-200 p-3 dark:border-slate-700";
  div.innerHTML = '<div class="grid grid-cols-[1fr_90px_auto] gap-2">' +

function readSaleFormRows() {
  return [...document.querySelectorAll(".sale-item")].map(r => ({
    codigo: r.querySelector(".product-select").value,
    quantidade: parseInt(r.querySelector(".qty").value, 10) || 0
  }));
}

function calcSaleForm() {
  let total = 0;
  document.querySelectorAll(".sale-item").forEach(r => {
    const p = state.products.find(x => String(x.codigo) === r.querySelector(".product-select").value);
    total += (p ? p.preco : 0) * (parseInt(r.querySelector(".qty").value, 10) || 0);
  });
  $("#saleTotal").textContent = money(round2(total));
  return total;
}

function onSubmitSaleForm(e) {

  m.className = "fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";
  m.innerHTML = '<div class="card w-full max-w-md p-5">' +
    '<div class="mb-4 flex justify-between"><h2 class="font-extrabold">Gerar fechamento</h2><button class="close btn btn-muted"><i data-lucide="x"></i></button></div>' +
    '<p class="mb-3 text-sm text-slate-500">Qual período você deseja fechar? O relatório reúne as vendas, o estoque e a documentação no formato de <strong>' + "senac_end.xlsx" + '</strong>.</p>' +
    '<form id="reportForm" class="space-y-3">' +
    '<div><label class="mb-1 block text-xs font-bold">Mês / ano</label><input id="reportMonth" class="field" type="month" required value="' + defaultMonth + '"></div>' +
    '<div id="reportPreview" class="text-xs text-slate-500"></div>' +
    '<div class="flex gap-2"><button type="button" class="close btn btn-muted flex-1">Cancelar</button><button class="btn btn-primary flex-1" type="submit"><i data-lucide="file-spreadsheet" class="h-4 w-4"></i> Gerar relatório</button></div>' +
    "</form></div>";
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelectorAll(".close").forEach(b => b.onclick = close);
  const updatePreview = () => {
    const val = $("#reportMonth").value;
    if (!val) return;
    const qtd = salesInMonth(val).length;
    $("#reportPreview").textContent = qtd ? qtd + " venda(s) encontrada(s) em " + monthLabel(val) + "." : "Nenhuma venda encontrada em " + monthLabel(val) + ".";
  };
  $("#reportMonth").oninput = updatePreview;
  updatePreview();
  m.querySelector("#reportForm").onsubmit = async e => {
    e.preventDefault();
    const val = $("#reportMonth").value;
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    const ok = await exportStyledWorkbook(val);
    btn.disabled = false;
    if (ok) close();
  };
  renderIcons();
}

/* ---------------- Restaurar dados ---------------- */
function confirmRestore() {
  const m = document.createElement("div");
  m.className = "fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";
  m.innerHTML = '<div class="card w-full max-w-sm p-5"><h2 class="mb-2 font-extrabold">Restaurar dados iniciais?</h2><p class="mb-4 text-sm text-slate-500">Todas as vendas, alterações de estoque e documentos feitos nesta sessão serão descartados. Esta ação não pode ser desfeita.</p><div class="flex gap-2"><button class="close btn btn-muted flex-1">Cancelar</button><button id="doRestore" class="btn btn-primary flex-1">Restaurar</button></div></div>';
  document.body.appendChild(m);
  m.querySelector(".close").onclick = () => m.remove();
  m.querySelector("#doRestore").onclick = () => { resetState(); m.remove(); render(); };
}

/* ---------------- Login / logout / navegação ---------------- */
function bindStaticEvents() {
  $("#loginForm").onsubmit = e => {
    e.preventDefault();
    const usuario = $("#loginUser").value.trim();
    const senha = $("#loginPassword").value;
    if (login(usuario, senha)) { resetState(true); showApp(); state.page = "dashboard"; render(); }
    else toast("Usuário ou senha incorretos.", "error");
  };
  $("#logoutBtn").onclick = () => { logout(); showLogin(); };
  $("#restoreBtn").onclick = confirmRestore;
  $("#reportBtnSide").onclick = openReportModal;
  document.querySelectorAll(".nav-item").forEach(b => b.onclick = () => {
    if (b.dataset.action === "restore") { confirmRestore(); return; }
    state.page = b.dataset.page; $("#sidebar").classList.add("-translate-x-full"); render();
  });
  $("#menuBtn").onclick = () => $("#sidebar").classList.toggle("-translate-x-full");
}

function init() {
  bindStaticEvents();
  showLogin();
  renderIcons();
}
document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
