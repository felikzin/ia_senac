<div id="toast" class="fixed right-4 top-4 z-[100] hidden max-w-sm rounded-xl px-4 py-3 text-sm font-semibold shadow-xl"></div>

<!-- LOGIN -->
<section id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md card p-8 shadow-xl">
    <div class="mb-8"><div class="mb-3 inline-flex rounded-2xl bg-blue-600 p-3 text-white"><i data-lucide="layout-dashboard"></i></div><h1 class="text-2xl font-extrabold">ERP Gestão Comercial</h1><p class="mt-1 text-sm text-slate-500">Sistema local, baseado em senac_end.xlsx. Sem servidor, sem nuvem.</p></div>
    <form id="loginForm" class="space-y-4">
      <div><label class="mb-1 block text-sm font-semibold">Usuário</label><input id="loginUser" class="field" type="text" autocomplete="username" required></div>
      <div><label class="mb-1 block text-sm font-semibold">Senha</label><input id="loginPassword" class="field" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-full" type="submit"><i data-lucide="log-in" class="h-4 w-4"></i> Entrar</button>
      <p class="text-xs text-slate-500">Acesso local de demonstração: usuário <strong>admin</strong>, senha <strong>admin</strong>.</p>
    </form>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden min-h-screen">
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full border-r border-slate-200 bg-white p-4 transition-transform lg:translate-x-0 dark:border-slate-800 dark:bg-slate-900">
    <div class="flex items-center gap-3 px-2 py-3"><div class="rounded-xl bg-blue-600 p-2 text-white"><i data-lucide="boxes"></i></div><div><div class="font-extrabold">ERP Gestão</div><div class="text-xs text-slate-500">Operação diária</div></div></div>
    <nav class="mt-5 space-y-1">

      <button class="nav-item" data-page="sales"><i data-lucide="receipt"></i> Registro de Vendas</button>
      <button class="nav-item" data-page="stock"><i data-lucide="package"></i> Gestão de Estoque</button>
      <button class="nav-item" data-page="docs"><i data-lucide="file-text"></i> Controle Documental</button>
    </nav>
    <div class="absolute bottom-4 left-4 right-4 space-y-2">

      <button id="reportBtnSide" class="btn btn-primary w-full"><i data-lucide="file-spreadsheet"></i> Gerar Fechamento</button>
    </div>
  </aside>

  <div class="lg:pl-64">
    <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white/90 px-4 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90 lg:px-6">

    <main id="main" class="p-4 lg:p-6"></main>
  </div>
</div>

<script>
/* ===================== ERP Gestão Comercial — lógica local (sem Firebase, sem persistência) ===================== */

const VENDEDORES_PADRAO = ["Almir","Bruno","Jefersson","João","Lucas","Paulo","Tiago"];
const MESES_PT = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const LOW_STOCK_THRESHOLD = 30;
const CREDENCIAIS = { usuario: "admin", senha: "admin" };

const $ = s => document.querySelector(s);
const money = v => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(v) || 0);
const dateBR = v => { const d = new Date(v); return isNaN(d) ? "—" : d.toLocaleDateString("pt-BR"); };
const dateTimeBR = v => { const d = new Date(v); return isNaN(d) ? "—" : d.toLocaleString("pt-BR"); };
const round2 = v => Math.round((Number(v) + Number.EPSILON) * 100) / 100;
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function renderIcons() { if (window.lucide) lucide.createIcons(); }
function toast(msg, type) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "fixed right-4 top-4 z-[100] max-w-sm rounded-xl px-4 py-3 text-sm font-semibold shadow-xl " + (type === "error" ? "bg-red-600 text-white" : "bg-slate-900 text-white");
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => t.classList.add("hidden"), 3200);
  t.classList.remove("hidden");
}

/* ---------- nome curto de produto (usado na coluna "Total produtos:") ---------- */
function shortName(nomeCompleto) {
  const i = nomeCompleto.indexOf(" (");
  return i === -1 ? nomeCompleto.trim() : nomeCompleto.slice(0, i).trim();
}

/* ---------- interpreta "3x Filtro de Óleo Lubrificante, 2x Bomba d'Água do Motor." ---------- */
function parseSaleItemsFromText(texto, products) {
  const itens = [];
  const naoEncontrados = [];
  const limpo = String(texto || "").trim().replace(/\.\s*$/, "");
  if (!limpo) return { itens, naoEncontrados };
  const partes = limpo.split(",").map(p => p.trim()).filter(Boolean);
  const lookup = new Map(products.map(p => [shortName(p.nome).toLowerCase(), p]));
  for (const parte of partes) {
    const m = parte.match(/^(\d+)\s*x\s+(.+)$/i);
    if (!m) { naoEncontrados.push(parte); continue; }
    const quantidade = parseInt(m[1], 10);
    const nomeDigitado = m[2].trim();
    const prod = lookup.get(nomeDigitado.toLowerCase());
    if (!prod) { naoEncontrados.push(parte); continue; }
    itens.push({ codigo: prod.codigo, nome: prod.nome, quantidade: quantidade, preco: prod.preco });
  }
  return { itens, naoEncontrados };
}

/* ---------- gera o texto "Total produtos:" a partir dos itens estruturados ---------- */
function generateProductsText(itens) {
  if (!itens.length) return "";
  return itens.map(i => (i.quantidade + "x " + shortName(i.nome))).join(", ") + ".";
}

/* ===================== estado ===================== */
const state = {
  page: "dashboard",
  products: [],
  sales: [],
  docs: [],
  user: null,
  charts: {}
};

function loadInitialData() {
  const products = structuredClone(INITIAL_DATA.products);
  const docs = structuredClone(INITIAL_DATA.docs);
  const sales = structuredClone(INITIAL_DATA.sales).map(s => {
    const parsed = parseSaleItemsFromText(s.totalProdutosTexto, products);
    if (parsed.naoEncontrados.length) console.warn("NF " + s.nota + ": itens nao reconhecidos:", parsed.naoEncontrados);
    return Object.assign({}, s, { itens: parsed.itens, historica: true });
  });
  return { products: products, sales: sales, docs: docs };
}

function resetState(silent) {
  const fresh = loadInitialData();
  state.products = fresh.products;
  state.sales = fresh.sales;
  state.docs = fresh.docs;
  if (!silent) toast("Dados iniciais restaurados. Alterações da sessão foram descartadas.");
}

/* ===================== autenticação local ===================== */
function login(usuario, senha) {
  if (usuario === CREDENCIAIS.usuario && senha === CREDENCIAIS.senha) {
    state.user = { nome: usuario };
    return true;
  }
  return false;
}
function logout() { state.user = null; }

/* ===================== vendas ===================== */
function nextNota() {
  const max = state.sales.reduce((a, s) => Math.max(a, Number(s.nota) || 0), 1000);
  return max + 1;
}

function vendedoresConhecidos() {
  const set = new Set(VENDEDORES_PADRAO);
  state.sales.forEach(s => { if (s.vendedor) set.add(s.vendedor); });
  return [...set].sort((a, b) => a.localeCompare(b, "pt-BR"));
}

/** Agrega linhas do formulário (mesmo produto em mais de uma linha é somado). */
function aggregateFormRows(rows) {
  const map = new Map();
  for (const r of rows) {
    if (!r.codigo) continue;
    const atual = map.get(r.codigo) || { codigo: r.codigo, quantidade: 0 };
    atual.quantidade += r.quantidade;
    map.set(r.codigo, atual);
  }
  return [...map.values()];
}

function validateSale(input) {
  const nota = input.nota, vendedor = input.vendedor, itensBrutos = input.itensBrutos;
  const erros = [];
  if (!nota || !Number.isInteger(nota) || nota <= 0) erros.push("Informe um número de nota fiscal válido.");
  if (state.sales.some(s => Number(s.nota) === Number(nota))) erros.push("A nota fiscal " + nota + " já existe.");
  if (!vendedor || !vendedor.trim()) erros.push("Selecione ou informe o vendedor.");
  if (!itensBrutos.length) erros.push("Adicione ao menos um produto à venda.");

  const agregados = aggregateFormRows(itensBrutos);
  const itens = [];
  for (const a of agregados) {
    const prod = state.products.find(p => String(p.codigo) === String(a.codigo));
    if (!prod) { erros.push("Produto de código " + a.codigo + " não encontrado."); continue; }
    if (!Number.isInteger(a.quantidade) || a.quantidade <= 0) { erros.push("Quantidade inválida para " + prod.nome + "."); continue; }
    if (a.quantidade > prod.quantidade) {
      erros.push("Estoque insuficiente para " + prod.nome + ". Disponível: " + prod.quantidade + ", solicitado: " + a.quantidade + ".");
      continue;
    }
    itens.push({ codigo: prod.codigo, nome: prod.nome, quantidade: a.quantidade, preco: prod.preco });
  }
  return { erros: erros, itens: itens };
}

function calculateSaleTotal(itens) {
  return round2(itens.reduce((sum, i) => sum + i.quantidade * i.preco, 0));
}

function applyStockReduction(itens) {
  for (const i of itens) {
    const prod = state.products.find(p => String(p.codigo) === String(i.codigo));
    prod.quantidade -= i.quantidade;
  }
}

function createSale(input) {
  const nota = input.nota, vendedor = input.vendedor, itens = input.itens;
  const valor = calculateSaleTotal(itens);
  const sale = {
    nota: Number(nota),
    emissao: new Date().toISOString(),
    vendedor: vendedor.trim(),
    itens: itens,
    totalProdutosTexto: generateProductsText(itens),
    valor: valor,
    historica: false
  };
  applyStockReduction(itens);
  state.sales.push(sale);
  return sale;
}

function findSaleByNumber(nota) {
  return state.sales.find(s => String(s.nota) === String(nota).trim());
}

/* ===================== produtos ===================== */
function saveProduct(p, isEditing) {
  const codigo = Number(p.codigo);
  if (!codigo || codigo <= 0) return { ok: false, error: "Código inválido." };
  if (!p.nome || !p.nome.trim()) return { ok: false, error: "Informe o nome do produto." };
  if (!(p.quantidade >= 0) || !Number.isInteger(p.quantidade)) return { ok: false, error: "Quantidade inválida." };
  if (!(p.preco >= 0)) return { ok: false, error: "Preço inválido." };
  const existente = state.products.find(x => x.codigo === codigo);
  if (existente && !isEditing) return { ok: false, error: "Já existe um produto com o código " + codigo + "." };
  if (existente) Object.assign(existente, { nome: p.nome.trim(), quantidade: p.quantidade, preco: round2(p.preco) });
  else state.products.push({ codigo: codigo, nome: p.nome.trim(), quantidade: p.quantidade, preco: round2(p.preco) });
  return { ok: true };
}

/* ===================== documentos ===================== */
function saveDoc(d, isEditing) {
  const id = Number(d.id);
  if (!id || id <= 0) return { ok: false, error: "ID inválido." };
  if (!d.nome || !d.nome.trim()) return { ok: false, error: "Informe o nome do documento." };
  const existente = state.docs.find(x => x.id === id);
  if (existente && !isEditing) return { ok: false, error: "Já existe um documento com o ID " + id + "." };
  if (existente) Object.assign(existente, { nome: d.nome.trim(), tipo: d.tipo.trim(), emissao: d.emissao, status: d.status });
  else state.docs.push({ id: id, nome: d.nome.trim(), tipo: d.tipo.trim(), emissao: d.emissao, status: d.status });
  return { ok: true };
}

/* ===================== indicadores ===================== */
function kpis() {
  const fatur = state.sales.reduce((a, x) => a + Number(x.valor || 0), 0);
  const qtd = state.sales.length;
  const low = state.products.filter(p => Number(p.quantidade) <= LOW_STOCK_THRESHOLD).length;
  const items = state.products.reduce((a, p) => a + Number(p.quantidade || 0), 0);
  const pend = state.docs.filter(d => d.status === "Pendente").length;
  return { fatur: fatur, qtd: qtd, low: low, ticket: qtd ? fatur / qtd : 0, items: items, pend: pend };
}

function produtosMaisVendidos(sales, limit) {
  limit = limit || 8;
  const acc = new Map();
  sales.forEach(s => (s.itens || []).forEach(i => acc.set(i.nome, (acc.get(i.nome) || 0) + Number(i.quantidade || 0))));
  return [...acc.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit);
}

/* ===================== fechamento mensal ===================== */
function salesInMonth(monthStr) {
  const parts = monthStr.split("-").map(Number);
  const y = parts[0], m = parts[1];
  const start = new Date(y, m - 1, 1, 0, 0, 0, 0);
  const end = new Date(y, m, 0, 23, 59, 59, 999);
  return state.sales
    .filter(s => { const d = new Date(s.emissao); return d >= start && d <= end; })
    .sort((a, b) => new Date(a.emissao) - new Date(b.emissao));
}

function monthLabel(monthStr) {
  const parts = monthStr.split("-").map(Number);
  const y = parts[0], m = parts[1];
  const nome = MESES_PT[m - 1];
  return nome.charAt(0).toUpperCase() + nome.slice(1) + "/" + y;
}
function monthFileTag(monthStr) {
  const parts = monthStr.split("-").map(Number);
  const y = parts[0], m = parts[1];
  return MESES_PT[m - 1] + "_" + y;
}

</script>
<script>
/* ===================== Exportação XLSX estilizada (ExcelJS) — fechamento mensal ===================== */

const COR_TITULO = "FF2B4C6F";
const COR_HEADER_BG = "FF304C6F";
const COR_HEADER_TXT = "FFFFFFFF";
const FONTE = "Arial";
const FMT_MOEDA = '"R$" #,##0.00';
const FMT_DATA = "dd/mm/yyyy";
const FMT_DATAHORA = "dd/mm/yyyy hh:mm";

function thinBorder() {
  return { top: { style: "thin", color: { argb: "FFCBD5E1" } }, left: { style: "thin", color: { argb: "FFCBD5E1" } }, bottom: { style: "thin", color: { argb: "FFCBD5E1" } }, right: { style: "thin", color: { argb: "FFCBD5E1" } } };
}
function doubleTopBorder() {
  return { top: { style: "double", color: { argb: "FF2B4C6F" } } };
}

function styleTitle(ws, ref, text) {
  ws.mergeCells(ref);
  const cell = ws.getCell(ref.split(":")[0]);
  cell.value = text;
  cell.font = { name: FONTE, size: 16, bold: true, color: { argb: COR_TITULO } };
  cell.alignment = { vertical: "center", horizontal: "left" };
}

function styleHeaderRow(ws, row, cols) {
  cols.forEach((label, idx) => {
    const cell = row.getCell(idx + 1);
    cell.value = label;
    cell.font = { name: FONTE, size: 11, bold: true, color: { argb: COR_HEADER_TXT } };
    cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: COR_HEADER_BG } };
    cell.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
  });
  row.commit();
}

function buildMenuSheet(wb, ctx) {
  const ws = wb.addWorksheet("MENU", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 3 }, { width: 32 }, { width: 22 }];
  styleTitle(ws, "B2:C2", "FECHAMENTO — " + ctx.label);
  ws.getCell("B3").value = "Período: " + ctx.periodoTexto;
  ws.getCell("B3").font = { name: FONTE, size: 10, italic: true, color: { argb: "FF64748B" } };

  const headerRow = ws.getRow(5);
  styleHeaderRow(ws, headerRow, ["", ""]);
  ws.getCell("B5").value = "Indicador";
  ws.getCell("C5").value = "Valor";

  const linhas = [
    ["Faturamento do período", ctx.fatur, FMT_MOEDA],
    ["Quantidade de vendas", ctx.qtd, "#,##0"],
    ["Ticket médio", ctx.ticket, FMT_MOEDA],
    ["Total de itens vendidos", ctx.totalItensVendidos, "#,##0"],
    ["Produtos com estoque baixo (≤ " + LOW_STOCK_THRESHOLD + ")", ctx.low, "#,##0"]
  ];
  linhas.forEach((linha, i) => {
    const r = ws.getRow(6 + i);
    r.getCell(2).value = linha[0];
    r.getCell(2).font = { name: FONTE, size: 11, color: { argb: "FF334155" } };
    r.getCell(3).value = linha[1];
    r.getCell(3).numFmt = linha[2];
    r.getCell(3).font = { name: FONTE, size: 12, bold: true, color: { argb: COR_TITULO } };
    r.getCell(2).border = thinBorder();
    r.getCell(3).border = thinBorder();
  });
}

function buildFinanceiroSheet(wb, ctx) {
  const ws = wb.addWorksheet("Financeiro", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 3 }, { width: 12 }, { width: 20 }, { width: 16 }, { width: 60 }, { width: 16 }, { width: 3 }, { width: 22 }, { width: 14 } ];
  styleTitle(ws, "B2:F2", "CONTROLE FINANCEIRO — Fechamento " + ctx.label);

  const headerRow = ws.getRow(4);
  styleHeaderRow(ws, headerRow, ["", "", "", "", ""]);
  ws.getCell("B4").value = "Nota";
  ws.getCell("C4").value = "Emissão";
  ws.getCell("D4").value = "Vendedor";
  ws.getCell("E4").value = "Total produtos:";
  ws.getCell("F4").value = "Valor";

  let r = 5;
  ctx.sales.forEach(s => {
    const row = ws.getRow(r);
    row.getCell(2).value = s.nota;
    row.getCell(3).value = new Date(s.emissao);
    row.getCell(3).numFmt = FMT_DATAHORA;
    row.getCell(4).value = s.vendedor;
    row.getCell(5).value = s.totalProdutosTexto;
    row.getCell(6).value = s.valor;
    row.getCell(6).numFmt = FMT_MOEDA;
    for (let c = 2; c <= 6; c++) {
      row.getCell(c).font = { name: FONTE, size: 10 };
      row.getCell(c).border = thinBorder();
      row.getCell(c).alignment = { vertical: "top", wrapText: c === 5 };
    }
    row.getCell(2).alignment = { horizontal: "center" };
    r++;
  });
  const totalRow = ws.getRow(r);
  ws.mergeCells("B" + r + ":E" + r);
  totalRow.getCell(2).value = "Total do período:";
  totalRow.getCell(2).font = { name: FONTE, size: 11, bold: true };
  totalRow.getCell(2).border = doubleTopBorder();
  totalRow.getCell(6).value = { formula: "SUM(F5:F" + (r - 1) + ")", result: ctx.fatur };
  totalRow.getCell(6).numFmt = FMT_MOEDA;
  totalRow.getCell(6).font = { name: FONTE, size: 11, bold: true, color: { argb: COR_TITULO } };
  totalRow.getCell(6).border = doubleTopBorder();

  // Painel "Consultar Nota Fiscal" (referência visual da planilha original)
  ws.mergeCells("H2:I2");
  ws.getCell("H2").value = "CONSULTAR NOTA FISCAL:";
  ws.getCell("H2").font = { name: FONTE, size: 13, bold: true, color: { argb: COR_TITULO } };
  ws.getCell("H4").value = "Número da nota:";
  ws.getCell("H4").font = { name: FONTE, size: 10, bold: true };
  const exemplo = ctx.sales[0];
  if (exemplo) {
    ws.getCell("I4").value = exemplo.nota;
    ws.getCell("I4").alignment = { horizontal: "center" };
    ["H5", "I5", "J5"].forEach((c, idx) => {
      ws.getCell(c).value = ["Emissão", "Vendedor", "Valor"][idx];
      ws.getCell(c).font = { name: FONTE, size: 10, bold: true, color: { argb: COR_HEADER_TXT } };
      ws.getCell(c).fill = { type: "pattern", pattern: "solid", fgColor: { argb: COR_HEADER_BG } };
      ws.getCell(c).alignment = { horizontal: "center" };
    });
    ws.getCell("H6").value = new Date(exemplo.emissao);
    ws.getCell("H6").numFmt = FMT_DATAHORA;
    ws.getCell("I6").value = exemplo.vendedor;
    ws.getCell("J6").value = exemplo.valor;
    ws.getCell("J6").numFmt = FMT_MOEDA;
    ["H4", "I4", "H6", "I6", "J6"].forEach(c => ws.getCell(c).border = thinBorder());
  }
}

function buildEstoqueSheet(wb, ctx) {
  const ws = wb.addWorksheet("Estoque", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 3 }, { width: 14 }, { width: 55 }, { width: 14 }, { width: 16 }, { width: 16 }];
  styleTitle(ws, "B2:C2", "CONTROLE DE ESTOQUE — situação em " + ctx.geradoEm);

  const headerRow = ws.getRow(4);
  styleHeaderRow(ws, headerRow, ["", "", "", "", ""]);
  ws.getCell("B4").value = "Cód Produto";
  ws.getCell("C4").value = "Nome do Produto";
  ws.getCell("D4").value = "Quantidade";
  ws.getCell("E4").value = "Preço Unitário";
  ws.getCell("F4").value = "Valor Total";

  const produtosOrdenados = ctx.products.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  let r = 5;
  produtosOrdenados.forEach(p => {
    const row = ws.getRow(r);
    row.getCell(2).value = p.codigo;
    row.getCell(3).value = p.nome;
    row.getCell(4).value = p.quantidade;
    row.getCell(5).value = p.preco;
    row.getCell(5).numFmt = FMT_MOEDA;
    row.getCell(6).value = { formula: "D" + r + "*E" + r, result: round2(p.quantidade * p.preco) };
    row.getCell(6).numFmt = FMT_MOEDA;
    for (let c = 2; c <= 6; c++) { row.getCell(c).font = { name: FONTE, size: 10 }; row.getCell(c).border = thinBorder(); }
    row.getCell(2).alignment = { horizontal: "center" };
    row.getCell(4).alignment = { horizontal: "center" };
    if (p.quantidade <= LOW_STOCK_THRESHOLD) row.getCell(4).font = { name: FONTE, size: 10, bold: true, color: { argb: "FFB45309" } };
    r++;
  });
  const totalRow = ws.getRow(r);
  totalRow.getCell(2).value = "Total Geral em Estoque";
  totalRow.getCell(2).font = { name: FONTE, size: 11, bold: true };
  totalRow.getCell(4).value = { formula: "SUM(D5:D" + (r - 1) + ")", result: ctx.products.reduce((a, p) => a + p.quantidade, 0) };
  totalRow.getCell(6).value = { formula: "SUM(F5:F" + (r - 1) + ")", result: round2(ctx.products.reduce((a, p) => a + p.quantidade * p.preco, 0)) };
  totalRow.getCell(6).numFmt = FMT_MOEDA;
  [2, 4, 6].forEach(c => { totalRow.getCell(c).border = doubleTopBorder(); totalRow.getCell(c).font = { name: FONTE, size: 11, bold: true, color: { argb: COR_TITULO } }; });
}

function buildDocumentacaoSheet(wb, ctx) {
  const ws = wb.addWorksheet("Documentação", { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 3 }, { width: 10 }, { width: 42 }, { width: 24 }, { width: 16 }, { width: 16 }];
  styleTitle(ws, "B2:C2", "CONTROLE DOCUMENTAL — situação em " + ctx.geradoEm);

  const headerRow = ws.getRow(4);
  styleHeaderRow(ws, headerRow, ["", "", "", "", ""]);
  ws.getCell("B4").value = "ID Doc";
  ws.getCell("C4").value = "Nome do Documento";
  ws.getCell("D4").value = "Tipo";
  ws.getCell("E4").value = "Data de Emissão";
  ws.getCell("F4").value = "Status";

  let r = 5;
  ctx.docs.forEach(d => {
    const row = ws.getRow(r);
    row.getCell(2).value = d.id;
    row.getCell(3).value = d.nome;
    row.getCell(4).value = d.tipo;
    row.getCell(5).value = new Date(d.emissao);
    row.getCell(5).numFmt = FMT_DATA;
    row.getCell(6).value = d.status;
    for (let c = 2; c <= 6; c++) { row.getCell(c).font = { name: FONTE, size: 10 }; row.getCell(c).border = thinBorder(); row.getCell(c).alignment = { horizontal: c === 3 ? "left" : "center" }; }
    r++;
  });
}

async function exportStyledWorkbook(monthStr) {
  const salesPeriodo = salesInMonth(monthStr);
  if (!salesPeriodo.length) {
    toast("Não é possível gerar o fechamento: não há vendas registradas em " + monthLabel(monthStr) + ".", "error");
    return false;
  }
  const label = monthLabel(monthStr);
  const [y, m] = monthStr.split("-").map(Number);
  const start = new Date(y, m - 1, 1);
  const end = new Date(y, m, 0);
  const fatur = round2(salesPeriodo.reduce((a, s) => a + s.valor, 0));
  const totalItensVendidos = salesPeriodo.reduce((a, s) => a + s.itens.reduce((x, i) => x + i.quantidade, 0), 0);
  const low = state.products.filter(p => p.quantidade <= LOW_STOCK_THRESHOLD).length;

  const ctx = {
    label: label,
    periodoTexto: dateBR(start) + " — " + dateBR(end),
    geradoEm: dateTimeBR(new Date()),
    sales: salesPeriodo,
    products: state.products,
    docs: state.docs,
    fatur: fatur,
    qtd: salesPeriodo.length,
    ticket: round2(fatur / salesPeriodo.length),
    totalItensVendidos: totalItensVendidos,
    low: low
  };

  const wb = new ExcelJS.Workbook();
  wb.creator = "ERP Gestão Comercial";
  wb.created = new Date();
  buildMenuSheet(wb, ctx);
  buildFinanceiroSheet(wb, ctx);
  buildEstoqueSheet(wb, ctx);
  buildDocumentacaoSheet(wb, ctx);

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "fechamento_" + monthFileTag(monthStr) + ".xlsx";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Fechamento de " + label + " gerado com sucesso.");
  return true;
}

</script>
<script>
/* ===================== UI: telas, modais, gráficos, eventos ===================== */

function showApp() {
  $("#loginScreen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#userName").textContent = state.user ? state.user.nome : "Usuário";
}
function showLogin() {
  $("#app").classList.add("hidden");
  $("#loginScreen").classList.remove("hidden");
  $("#loginScreen").classList.add("flex");
  $("#loginPassword").value = "";
}

function render() {
  switch (state.page) {
    case "dashboard": renderDashboard(); break;
    case "sales": renderSales(); break;
    case "stock": renderStock(); break;
    case "docs": renderDocs(); break;
  }

}

/* ---------------- Dashboard ---------------- */
function kpiCard(title, val, icon, cls) {
  return '<div class="card p-4"><div class="flex items-center justify-between"><span class="text-sm font-semibold text-slate-500">' + title + '</span><span class="' + cls + '"><i data-lucide="' + icon + '"></i></span></div><div class="mt-3 text-2xl font-extrabold">' + val + "</div></div>";
}
function destroyCharts() { Object.values(state.charts).forEach(c => c && c.destroy()); state.charts = {}; }

function renderDashboard() {
  const k = kpis();
  $("#main").innerHTML =
    '<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">' +
    kpiCard("Faturamento Total", money(k.fatur), "trending-up", "text-emerald-600") +
    kpiCard("Quantidade de Vendas", k.qtd, "shopping-cart", "text-blue-600") +
    kpiCard("Estoque Baixo", k.low, "triangle-alert", "text-amber-600") +
    kpiCard("Ticket Médio", money(k.ticket), "receipt", "text-violet-600") +
    "</div>" +
    '<div class="mt-4 grid gap-4 xl:grid-cols-3">' +
    '<div class="card p-4 xl:col-span-2"><div class="mb-3 font-bold">Evolução do Faturamento</div><div class="h-72"><canvas id="salesEvolution"></canvas></div></div>' +
    '<div class="card p-4"><div class="mb-3 font-bold">Vendas por Vendedor</div><div class="h-72"><canvas id="sellerChart"></canvas></div></div>' +
    "</div>" +
    '<div class="mt-4 grid gap-4 xl:grid-cols-3">' +
    '<div class="card p-4"><div class="mb-3 font-bold">Produtos mais vendidos</div><div class="h-72"><canvas id="productChart"></canvas></div></div>' +
    '<div class="card p-4 xl:col-span-2"><div class="mb-3 flex items-center justify-between"><div class="font-bold">Últimas vendas</div><button class="btn btn-muted" data-go="sales">Ver todas</button></div>' +
    salesTable(state.sales.slice().sort((a, b) => new Date(b.emissao) - new Date(a.emissao)).slice(0, 8)) +
    "</div></div>";
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { state.page = b.dataset.go; render(); });
  drawCharts();
}

function drawCharts() {
  destroyCharts();
  const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };
  const sellers = {};
  state.sales.forEach(s => sellers[s.vendedor] = (sellers[s.vendedor] || 0) + Number(s.valor || 0));
  state.charts.seller = new Chart($("#sellerChart"), { type: "bar", data: { labels: Object.keys(sellers), datasets: [{ data: Object.values(sellers), borderRadius: 8, backgroundColor: "#2563eb" }] }, options: Object.assign({}, opts, { scales: { y: { beginAtZero: true } } }) });

  const months = {};
  state.sales.forEach(s => { const d = new Date(s.emissao), key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); months[key] = (months[key] || 0) + Number(s.valor || 0); });
  const labels = Object.keys(months).sort();
  state.charts.evo = new Chart($("#salesEvolution"), { type: "line", data: { labels: labels, datasets: [{ label: "Faturamento", data: labels.map(x => months[x]), tension: .35, fill: true, borderColor: "#2563eb", backgroundColor: "rgba(37,99,235,.12)" }] }, options: Object.assign({}, opts, { scales: { y: { beginAtZero: true } } }) });

  let top = produtosMaisVendidos(state.sales, 8);
  if (!top.length) top = state.products.slice().sort((a, b) => b.quantidade - a.quantidade).slice(0, 8).map(p => [p.nome, p.quantidade]);
  state.charts.product = new Chart($("#productChart"), { type: "doughnut", data: { labels: top.map(x => shortName(x[0]).slice(0, 26)), datasets: [{ data: top.map(x => x[1]) }] }, options: { responsive: true, maintainAspectRatio: false } });
}

function salesTable(rows) {
  return '<div class="overflow-auto scrollbar"><table class="table w-full text-sm"><thead><tr><th>Nota</th><th>Emissão</th><th>Vendedor</th><th class="text-right">Valor</th></tr></thead><tbody>' +
    rows.map(s => '<tr class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60" data-nota="' + esc(s.nota) + '"><td class="font-bold">#' + esc(s.nota) + "</td><td>" + dateTimeBR(s.emissao) + "</td><td>" + esc(s.vendedor) + '</td><td class="text-right font-semibold">' + money(s.valor) + "</td></tr>").join("") +
    "</tbody></table></div>";
}

/* ---------------- Registro de Vendas ---------------- */
function renderSales() {
  const vendedores = vendedoresConhecidos();
  $("#main").innerHTML =
    '<div class="grid gap-4 xl:grid-cols-3">' +
    '<div class="card p-5 xl:col-span-1">' +
    '<div class="mb-4"><h2 class="font-extrabold">Nova nota fiscal</h2><p class="text-xs text-slate-500">A confirmação abate o estoque imediatamente. A emissão é registrada no momento da confirmação.</p></div>' +
    '<form id="saleForm" class="space-y-3">' +
    '<div class="grid grid-cols-2 gap-3">' +
    '<div><label class="mb-1 block text-xs font-bold">Nº da Nota</label><input id="saleNota" class="field" type="number" min="1" required value="' + nextNota() + '"></div>' +
    '<div><label class="mb-1 block text-xs font-bold">Emissão</label><div class="field flex items-center gap-2 bg-slate-100 text-slate-500 dark:bg-slate-800"><i data-lucide="clock" class="h-4 w-4"></i> Agora</div></div>' +
    "</div>" +
    '<div><label class="mb-1 block text-xs font-bold">Vendedor</label><select id="saleSeller" class="field">' +
    vendedores.map(v => "<option>" + esc(v) + "</option>").join("") +
    '<option value="__outro__">+ Outro (digitar)</option></select>' +
    '<input id="saleSellerOther" class="field mt-2 hidden" placeholder="Nome do vendedor"></div>' +
    '<div id="saleItems"></div>' +
    '<button type="button" id="addItem" class="btn btn-muted w-full"><i data-lucide="plus"></i> Adicionar produto</button>' +
    '<div class="rounded-xl bg-slate-100 p-4 dark:bg-slate-800"><div class="flex justify-between text-sm"><span>Total</span><strong id="saleTotal">' + money(0) + "</strong></div></div>" +
    '<button class="btn btn-primary w-full" type="submit"><i data-lucide="check"></i> Confirmar venda</button>' +
    "</form>" +
    "</div>" +
    '<div class="xl:col-span-2 space-y-4">' +
    '<div class="card p-5">' +
    '<div class="mb-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between"><h2 class="font-extrabold">Consultar nota fiscal</h2></div>' +
    '<form id="consultaForm" class="flex gap-2"><input id="consultaNota" class="field" type="number" placeholder="Número da nota, ex: 1056" required><button class="btn btn-primary" type="submit"><i data-lucide="search" class="h-4 w-4"></i> Buscar</button></form>' +
    '<div id="consultaResult" class="mt-3"></div>' +
    "</div>" +
    '<div class="card p-5">' +
    '<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div><h2 class="font-extrabold">Histórico de vendas</h2><p class="text-xs text-slate-500">' + state.sales.length + ' notas cadastradas nesta sessão</p></div><input id="saleSearch" class="field sm:max-w-xs" placeholder="Buscar nota ou vendedor..."></div>' +
    '<div id="salesList"></div>' +
    "</div></div></div>";

  addSaleItem();
  $("#addItem").onclick = addSaleItem;
  $("#saleForm").onsubmit = onSubmitSaleForm;
  $("#saleSeller").onchange = () => $("#saleSellerOther").classList.toggle("hidden", $("#saleSeller").value !== "__outro__");
  $("#saleSearch").oninput = e => renderSalesList(e.target.value);
  $("#consultaForm").onsubmit = onSubmitConsulta;
  renderSalesList();
  renderIcons();
}

function nomeVendedorSelecionado() {
  const sel = $("#saleSeller").value;
  return sel === "__outro__" ? $("#saleSellerOther").value.trim() : sel;
}

function addSaleItem() {
  const wrap = $("#saleItems"), div = document.createElement("div");
  div.className = "sale-item mb-3 rounded-xl border border-slate-200 p-3 dark:border-slate-700";
  div.innerHTML = '<div class="grid grid-cols-[1fr_90px_auto] gap-2">' +
    '<select class="product-select field">' + state.products.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR")).map(p => '<option value="' + esc(p.codigo) + '">' + esc(p.codigo) + " • " + esc(p.nome.slice(0, 42)) + " — " + money(p.preco) + "</option>").join("") + "</select>" +
    '<input class="qty field" type="number" min="1" step="1" value="1">' +
    '<button type="button" class="remove-item btn btn-muted" title="Remover"><i data-lucide="trash-2"></i></button>' +
    "</div>";
  div.querySelector(".remove-item").onclick = () => { if (document.querySelectorAll(".sale-item").length > 1) div.remove(); calcSaleForm(); };
  div.querySelectorAll("select,input").forEach(x => x.oninput = calcSaleForm);
  wrap.appendChild(div);
  calcSaleForm();
  renderIcons();
}

function readSaleFormRows() {
  return [...document.querySelectorAll(".sale-item")].map(r => ({
    codigo: r.querySelector(".product-select").value,
    quantidade: parseInt(r.querySelector(".qty").value, 10) || 0
  }));
}

function calcSaleForm() {
  let total = 0;
  document.querySelectorAll(".sale-item").forEach(r => {
    const p = state.products.find(x => String(x.codigo) === r.querySelector(".product-select").value);
    total += (p ? p.preco : 0) * (parseInt(r.querySelector(".qty").value, 10) || 0);
  });
  $("#saleTotal").textContent = money(round2(total));
  return total;
}

function onSubmitSaleForm(e) {
  e.preventDefault();
  const nota = parseInt($("#saleNota").value, 10);
  const vendedor = nomeVendedorSelecionado();
  const itensBrutos = readSaleFormRows();
  const { erros, itens } = validateSale({ nota, vendedor, itensBrutos });
  if (erros.length) { toast(erros[0], "error"); return; }
  openConfirmSaleModal({ nota, vendedor, itens });
}

function openConfirmSaleModal(draft) {
  const total = calculateSaleTotal(draft.itens);
  const totalUnid = draft.itens.reduce((a, i) => a + i.quantidade, 0);
  const m = document.createElement("div");
  m.className = "fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";
  m.innerHTML = '<div class="card w-full max-w-md p-5">' +
    '<div class="mb-4 flex justify-between"><h2 class="font-extrabold">Confirmar venda</h2><button class="close btn btn-muted"><i data-lucide="x"></i></button></div>' +
    '<div class="space-y-2 text-sm">' +
    '<div class="flex justify-between"><span class="text-slate-500">Nota fiscal</span><strong>#' + draft.nota + "</strong></div>" +
    '<div class="flex justify-between"><span class="text-slate-500">Vendedor</span><strong>' + esc(draft.vendedor) + "</strong></div>" +
    '<div class="flex justify-between"><span class="text-slate-500">Itens</span><strong>' + draft.itens.length + " produto(s), " + totalUnid + " unidade(s)</strong></div>" +
    '<div class="rounded-lg border border-slate-200 dark:border-slate-700 divide-y divide-slate-200 dark:divide-slate-700">' +
    draft.itens.map(i => '<div class="flex justify-between p-2"><span>' + i.quantidade + "x " + esc(shortName(i.nome)) + "</span><span>" + money(i.quantidade * i.preco) + "</span></div>").join("") +
    "</div>" +
    '<div class="flex justify-between text-base font-extrabold pt-1"><span>Total</span><span>' + money(total) + "</span></div>" +
    '<p class="text-xs text-slate-500">Ao confirmar, o estoque será atualizado imediatamente.</p>' +
    "</div>" +
    '<button id="confirmSaleBtn" class="btn btn-primary mt-4 w-full"><i data-lucide="check"></i> Confirmar venda</button>' +
    "</div>";
  document.body.appendChild(m);
  m.querySelector(".close").onclick = () => m.remove();
  m.querySelector("#confirmSaleBtn").onclick = () => {
    const sale = createSale(draft);
    m.remove();
    toast("Venda registrada com sucesso. Estoque atualizado.");
    render();
  };
  renderIcons();
}

function renderSalesList(term) {
  const t = (term || "").toLowerCase();
  const rows = state.sales.slice().sort((a, b) => new Date(b.emissao) - new Date(a.emissao))
    .filter(s => String(s.nota).includes(t) || String(s.vendedor).toLowerCase().includes(t));
  $("#salesList").innerHTML = salesTable(rows);
  document.querySelectorAll("#salesList tr[data-nota]").forEach(tr => tr.onclick = () => openSaleDetailModal(tr.dataset.nota));
}

function onSubmitConsulta(e) {
  e.preventDefault();
  const nota = $("#consultaNota").value;
  const sale = findSaleByNumber(nota);
  $("#consultaResult").innerHTML = sale ? consultaResultHTML(sale) : '<div class="rounded-lg bg-amber-50 p-3 text-sm text-amber-700 dark:bg-amber-950/40 dark:text-amber-300">Nota fiscal não encontrada.</div>';
}

function consultaResultHTML(sale) {
  return '<div class="rounded-xl border border-slate-200 p-4 dark:border-slate-700">' +
    '<div class="mb-2 flex flex-wrap items-center justify-between gap-2"><div class="font-extrabold">NF #' + esc(sale.nota) + "</div><div class=\"text-sm text-slate-500\">" + dateTimeBR(sale.emissao) + "</div></div>" +
    '<div class="mb-3 text-sm"><span class="text-slate-500">Vendedor:</span> <strong>' + esc(sale.vendedor) + "</strong></div>" +
    '<div class="overflow-auto scrollbar"><table class="table w-full text-sm"><thead><tr><th>Produto</th><th class="text-right">Qtd</th><th class="text-right">Preço Unit.</th><th class="text-right">Subtotal</th></tr></thead><tbody>' +
    sale.itens.map(i => "<tr><td>" + esc(i.nome) + '</td><td class="text-right">' + i.quantidade + '</td><td class="text-right">' + money(i.preco) + '</td><td class="text-right font-semibold">' + money(i.quantidade * i.preco) + "</td></tr>").join("") +
    "</tbody></table></div>" +
    '<div class="mt-3 flex justify-end text-base font-extrabold">Total: ' + money(sale.valor) + "</div>" +
    "</div>";
}

function openSaleDetailModal(nota) {
  const sale = findSaleByNumber(nota);
  if (!sale) return;
  const m = document.createElement("div");
  m.className = "fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";
  m.innerHTML = '<div class="card w-full max-w-lg p-5"><div class="mb-3 flex justify-between"><h2 class="font-extrabold">Detalhes da nota</h2><button class="close btn btn-muted"><i data-lucide="x"></i></button></div>' + consultaResultHTML(sale) + "</div>";
  document.body.appendChild(m);
  m.querySelector(".close").onclick = () => m.remove();
  renderIcons();
}

/* ---------------- Estoque ---------------- */
function renderStock() {
  $("#main").innerHTML = '<div class="card p-5">' +
    '<div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between"><div><h2 class="font-extrabold">Produtos e estoque</h2><p class="text-xs text-slate-500">' + state.products.length + " produtos • " + kpis().items + ' itens físicos</p></div><button id="newProduct" class="btn btn-primary"><i data-lucide="plus"></i> Novo produto</button></div>' +
    '<div class="mb-4"><input id="stockSearch" class="field max-w-lg" placeholder="Buscar por código ou nome..."></div><div id="stockList"></div></div>';
  $("#newProduct").onclick = () => productModal();
  $("#stockSearch").oninput = e => renderStockList(e.target.value);
  renderStockList();
  renderIcons();
}
function renderStockList(term) {
  const t = (term || "").toLowerCase();
  const rows = state.products.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR")).filter(p => String(p.codigo).includes(t) || p.nome.toLowerCase().includes(t));
  $("#stockList").innerHTML = '<div class="overflow-auto scrollbar"><table class="table w-full text-sm"><thead><tr><th>Código</th><th>Produto</th><th>Quantidade</th><th>Preço</th><th>Valor Total</th><th>Status</th><th></th></tr></thead><tbody>' +
    rows.map(p => {
      const low = p.quantidade <= LOW_STOCK_THRESHOLD;
      return "<tr><td class=\"font-bold\">" + p.codigo + "</td><td>" + esc(p.nome) + '</td><td class="font-bold">' + p.quantidade + "</td><td>" + money(p.preco) + "</td><td>" + money(p.quantidade * p.preco) + '</td><td><span class="rounded-full px-2 py-1 text-xs font-bold ' + (low ? "bg-amber-100 text-amber-700" : "bg-emerald-100 text-emerald-700") + '">' + (low ? "Baixo" : "Normal") + '</span></td><td><button class="edit-prod btn btn-muted" data-id="' + p.codigo + '"><i data-lucide="pencil"></i></button></td></tr>';
    }).join("") + "</tbody></table></div>";
  document.querySelectorAll(".edit-prod").forEach(b => b.onclick = () => productModal(state.products.find(p => String(p.codigo) === b.dataset.id)));
  renderIcons();
}
function productModal(p) {
  const isEditing = !!p;
  const m = document.createElement("div");
  m.className = "fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";
  const nextCode = p ? p.codigo : (Math.max(0, ...state.products.map(x => x.codigo)) + 1);
  m.innerHTML = '<div class="card w-full max-w-lg p-5"><div class="mb-4 flex justify-between"><h2 class="font-extrabold">' + (isEditing ? "Editar produto" : "Novo produto") + '</h2><button class="close btn btn-muted"><i data-lucide="x"></i></button></div>' +
    '<form class="space-y-3">' +
    '<div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold">Código</label><input id="pCode" class="field" type="number" required value="' + nextCode + '" ' + (isEditing ? "readonly" : "") + '></div><div><label class="text-xs font-bold">Quantidade</label><input id="pQty" class="field" type="number" min="0" step="1" required value="' + (p ? p.quantidade : 0) + '"></div></div>' +
    '<div><label class="text-xs font-bold">Nome</label><input id="pName" class="field" required value="' + esc(p ? p.nome : "") + '"></div>' +
    '<div><label class="text-xs font-bold">Preço unitário</label><input id="pPrice" class="field" type="number" min="0" step="0.01" required value="' + (p ? p.preco : 0) + '"></div>' +
    '<button class="btn btn-primary w-full">Salvar</button>' +
    "</form></div>";
  document.body.appendChild(m);
  m.querySelector(".close").onclick = () => m.remove();
  m.querySelector("form").onsubmit = e => {
    e.preventDefault();
    const res = saveProduct({ codigo: $("#pCode").value, nome: $("#pName").value, quantidade: parseInt($("#pQty").value, 10), preco: parseFloat($("#pPrice").value) }, isEditing);
    if (!res.ok) { toast(res.error, "error"); return; }
    m.remove();
    toast("Produto salvo.");
    render();
  };
  renderIcons();
}

/* ---------------- Documentação ---------------- */
function renderDocs() {
  $("#main").innerHTML = '<div class="card p-5"><div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between"><div><h2 class="font-extrabold">Documentação</h2><p class="text-xs text-slate-500">' + state.docs.filter(d => d.status === "Pendente").length + ' pendentes</p></div><button id="newDoc" class="btn btn-primary"><i data-lucide="plus"></i> Novo documento</button></div><div class="mb-4"><input id="docSearch" class="field max-w-lg" placeholder="Buscar documento, tipo ou status..."></div><div id="docList"></div></div>';
  $("#newDoc").onclick = () => docModal();
  $("#docSearch").oninput = e => renderDocsList(e.target.value);
  renderDocsList();
  renderIcons();
}
function renderDocsList(term) {
  const t = (term || "").toLowerCase();
  const rows = state.docs.filter(d => [d.id, d.nome, d.tipo, d.status].some(x => String(x).toLowerCase().includes(t)));
  $("#docList").innerHTML = '<div class="overflow-auto scrollbar"><table class="table w-full text-sm"><thead><tr><th>ID</th><th>Documento</th><th>Tipo</th><th>Emissão</th><th>Status</th><th></th></tr></thead><tbody>' +
    rows.map(d => "<tr><td class=\"font-bold\">" + d.id + "</td><td>" + esc(d.nome) + "</td><td>" + esc(d.tipo) + "</td><td>" + dateBR(d.emissao) + '</td><td><select class="doc-status field max-w-40" data-id="' + d.id + '">' + ["Pendente", "Aprovado", "Arquivado", "Concluído"].map(s => "<option " + (d.status === s ? "selected" : "") + ">" + s + "</option>").join("") + '</select></td><td><button class="edit-doc btn btn-muted" data-id="' + d.id + '"><i data-lucide="pencil"></i></button></td></tr>').join("") +
    "</tbody></table></div>";
  document.querySelectorAll(".doc-status").forEach(s => s.onchange = () => {
    const d = state.docs.find(x => String(x.id) === s.dataset.id);
    d.status = s.value;
    toast("Status atualizado.");
  });
  document.querySelectorAll(".edit-doc").forEach(b => b.onclick = () => docModal(state.docs.find(d => String(d.id) === b.dataset.id)));
  renderIcons();
}
function docModal(d) {
  const isEditing = !!d;
  const m = document.createElement("div");
  m.className = "fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";
  const nextId = d ? d.id : (Math.max(0, ...state.docs.map(x => x.id)) + 1);
  m.innerHTML = '<div class="card w-full max-w-lg p-5"><div class="mb-4 flex justify-between"><h2 class="font-extrabold">' + (isEditing ? "Editar documento" : "Novo documento") + '</h2><button class="close btn btn-muted"><i data-lucide="x"></i></button></div>' +
    '<form class="space-y-3">' +
    '<div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold">ID Doc</label><input id="dId" class="field" type="number" required value="' + nextId + '" ' + (isEditing ? "readonly" : "") + '></div><div><label class="text-xs font-bold">Data de emissão</label><input id="dDate" class="field" type="date" required value="' + (d ? d.emissao : new Date().toISOString().slice(0, 10)) + '"></div></div>' +
    '<div><label class="text-xs font-bold">Nome do documento</label><input id="dName" class="field" required value="' + esc(d ? d.nome : "") + '"></div>' +
    '<div><label class="text-xs font-bold">Tipo</label><input id="dType" class="field" required value="' + esc(d ? d.tipo : "") + '"></div>' +
    '<div><label class="text-xs font-bold">Status</label><select id="dStatus" class="field">' + ["Pendente", "Aprovado", "Arquivado", "Concluído"].map(s => "<option " + (d && d.status === s ? "selected" : "") + ">" + s + "</option>").join("") + "</select></div>" +
    '<button class="btn btn-primary w-full">Salvar</button>' +
    "</form></div>";
  document.body.appendChild(m);
  m.querySelector(".close").onclick = () => m.remove();
  m.querySelector("form").onsubmit = e => {
    e.preventDefault();
    const res = saveDoc({ id: $("#dId").value, nome: $("#dName").value, tipo: $("#dType").value, emissao: $("#dDate").value, status: $("#dStatus").value }, isEditing);
    if (!res.ok) { toast(res.error, "error"); return; }
    m.remove();
    toast("Documento salvo.");
    render();
  };
  renderIcons();
}

/* ---------------- Fechamento mensal (relatório) ---------------- */
function openReportModal() {
  const now = new Date();
  const defaultMonth = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const m = document.createElement("div");
  m.className = "fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";
  m.innerHTML = '<div class="card w-full max-w-md p-5">' +
    '<div class="mb-4 flex justify-between"><h2 class="font-extrabold">Gerar fechamento</h2><button class="close btn btn-muted"><i data-lucide="x"></i></button></div>' +
    '<p class="mb-3 text-sm text-slate-500">Qual período você deseja fechar? O relatório reúne as vendas, o estoque e a documentação no formato de <strong>' + "senac_end.xlsx" + '</strong>.</p>' +
    '<form id="reportForm" class="space-y-3">' +
    '<div><label class="mb-1 block text-xs font-bold">Mês / ano</label><input id="reportMonth" class="field" type="month" required value="' + defaultMonth + '"></div>' +
    '<div id="reportPreview" class="text-xs text-slate-500"></div>' +
    '<div class="flex gap-2"><button type="button" class="close btn btn-muted flex-1">Cancelar</button><button class="btn btn-primary flex-1" type="submit"><i data-lucide="file-spreadsheet" class="h-4 w-4"></i> Gerar relatório</button></div>' +
    "</form></div>";
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelectorAll(".close").forEach(b => b.onclick = close);
  const updatePreview = () => {
    const val = $("#reportMonth").value;
    if (!val) return;
    const qtd = salesInMonth(val).length;
    $("#reportPreview").textContent = qtd ? qtd + " venda(s) encontrada(s) em " + monthLabel(val) + "." : "Nenhuma venda encontrada em " + monthLabel(val) + ".";
  };
  $("#reportMonth").oninput = updatePreview;
  updatePreview();
  m.querySelector("#reportForm").onsubmit = async e => {
    e.preventDefault();
    const val = $("#reportMonth").value;
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    const ok = await exportStyledWorkbook(val);
    btn.disabled = false;
    if (ok) close();
  };
  renderIcons();
}

/* ---------------- Restaurar dados ---------------- */
function confirmRestore() {
  const m = document.createElement("div");
  m.className = "fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";
  m.innerHTML = '<div class="card w-full max-w-sm p-5"><h2 class="mb-2 font-extrabold">Restaurar dados iniciais?</h2><p class="mb-4 text-sm text-slate-500">Todas as vendas, alterações de estoque e documentos feitos nesta sessão serão descartados. Esta ação não pode ser desfeita.</p><div class="flex gap-2"><button class="close btn btn-muted flex-1">Cancelar</button><button id="doRestore" class="btn btn-primary flex-1">Restaurar</button></div></div>';
  document.body.appendChild(m);
  m.querySelector(".close").onclick = () => m.remove();
  m.querySelector("#doRestore").onclick = () => { resetState(); m.remove(); render(); };
}

/* ---------------- Login / logout / navegação ---------------- */
function bindStaticEvents() {
  $("#loginForm").onsubmit = e => {
    e.preventDefault();
    const usuario = $("#loginUser").value.trim();
    const senha = $("#loginPassword").value;
    if (login(usuario, senha)) { resetState(true); showApp(); state.page = "dashboard"; render(); }
    else toast("Usuário ou senha incorretos.", "error");
  };
  $("#logoutBtn").onclick = () => { logout(); showLogin(); };
  $("#restoreBtn").onclick = confirmRestore;
  $("#reportBtnSide").onclick = openReportModal;
  document.querySelectorAll(".nav-item").forEach(b => b.onclick = () => { state.page = b.dataset.page; $("#sidebar").classList.add("-translate-x-full"); render(); });
  $("#menuBtn").onclick = () => $("#sidebar").classList.toggle("-translate-x-full");
  $("#themeBtn").onclick = () => { document.documentElement.classList.toggle("dark"); localStorage.setItem("erp_dark", document.documentElement.classList.contains("dark") ? "1" : "0"); };
  if (localStorage.getItem("erp_dark") === "1") document.documentElement.classList.add("dark");
}

function init() {
  bindStaticEvents();
  showLogin();
  renderIcons();
}
document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
