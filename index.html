<!-- LOGIN -->
<section id="loginScreen" class="min-h-screen hidden items-center justify-center p-6">
  <div class="w-full max-w-md card p-8 shadow-xl">
    <div class="mb-8"><div class="mb-3 inline-flex rounded-2xl bg-blue-600 p-3 text-white"><i data-lucide="layout-dashboard"></i></div><h1 class="text-2xl font-extrabold">ERP Gestão Comercial</h1><p class="mt-1 text-sm text-slate-500">Acesse sua operação centralizada.</p></div>
    <form id="loginForm" class="space-y-4">
      <div><label class="mb-1 block text-sm font-semibold">E-mail</label><input id="loginEmail" class="field" type="email" required></div>
      <div><label class="mb-1 block text-sm font-semibold">Senha</label><input id="loginPassword" class="field" type="password" required></div>
      <button class="btn btn-primary w-full" type="submit"><i data-lucide="log-in" class="h-4 w-4"></i> Entrar</button>
      <p id="loginHint" class="text-xs text-slate-500">Modo Firebase: configure as credenciais no arquivo. Em modo demonstração, use qualquer e-mail/senha.</p>
    </form>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden min-h-screen">
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full border-r border-slate-200 bg-white p-4 transition-transform lg:translate-x-0 dark:border-slate-800 dark:bg-slate-900">
    <div class="flex items-center gap-3 px-2 py-3"><div class="rounded-xl bg-blue-600 p-2 text-white"><i data-lucide="boxes"></i></div><div><div class="font-extrabold">ERP Gestão</div><div class="text-xs text-slate-500">Operação diária</div></div></div>
    <nav class="mt-5 space-y-1">

      <button class="nav-item" data-page="sales"><i data-lucide="receipt"></i> Registro de Vendas</button>
      <button class="nav-item" data-page="stock"><i data-lucide="package"></i> Gestão de Estoque</button>
      <button class="nav-item" data-page="docs"><i data-lucide="file-text"></i> Controle Documental</button>
    </nav>
    <div class="absolute bottom-4 left-4 right-4 space-y-2">

      <button id="exportBtnSide" class="btn btn-primary w-full"><i data-lucide="file-spreadsheet"></i> Exportar XLSX</button>
    </div>
  </aside>

  <div class="lg:pl-64">
    <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white/90 px-4 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90 lg:px-6">

    </header>
    <main id="main" class="p-4 lg:p-6"></main>
  </div>
</div>

const FIREBASE_CONFIG = {"apiKey": "COLOQUE_SUA_API_KEY", "authDomain": "SEU_PROJETO.firebaseapp.com", "projectId": "SEU_PROJECT_ID", "storageBucket": "SEU_PROJETO.firebasestorage.app", "messagingSenderId": "SEU_MESSAGING_SENDER_ID", "appId": "SEU_APP_ID"};

const state={page:"dashboard",products:[],sales:[],docs:[],user:null,mode:"local",charts:{}};
let db=null,auth=null;

const $=s=>document.querySelector(s);
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);
const dateBR=v=>{const d=new Date(v);return isNaN(d)?"—":d.toLocaleDateString("pt-BR")};
const nowLocal=()=>{const d=new Date(), off=d.getTimezoneOffset(), x=new Date(d.getTime()-off*60000);return x.toISOString().slice(0,16)};
function toast(msg,type="ok"){const t=$("#toast");t.textContent=msg;t.className=`fixed right-4 top-4 z-[100] max-w-sm rounded-xl px-4 py-3 text-sm font-semibold shadow-xl ${type==="error"?"bg-red-600 text-white":"bg-slate-900 text-white"};`;setTimeout(()=>t.classList.add("hidden"),2800);t.classList.remove("hidden")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderIcons(){if(window.lucide)lucide.createIcons()}
function firebaseReady(){return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("COLOQUE_") && FIREBASE_CONFIG.projectId && !FIREBASE_CONFIG.projectId.startsWith("SEU_")}

async function init(){
  $("#loginScreen").classList.add("hidden"); $("#app").classList.remove("hidden");
  loadLocal();
  if(firebaseReady()){
    try{
      const app=initializeApp(FIREBASE_CONFIG);auth=getAuth(app);db=getFirestore(app);state.mode="firebase";
      $("#modeLabel").textContent="Firebase • Firestore";
      onAuthStateChanged(auth,async u=>{state.user=u;$("#userName").textContent=u?.email||"Usuário";if(u){await loadFirestore();render()}});
      if(!auth.currentUser){$("#app").classList.add("hidden");$("#loginScreen").class.remove("hidden");$("#loginScreen").class.add("flex")}
    }catch(e){console.error(e);state.mode="local";$("#modeLabel").textContent="Modo demonstração local";render()}
  }else{$("#modeLabel").textContent="Modo demonstração local • Firebase não configurado";render()}
}
function loadLocal(){
  const saved=localStorage.getItem("erp_gestao_state");
  if(saved){Object.assign(state,JSON.parse(saved));return}
  state.products=structuredClone(MOCK.products);state.sales=structuredClone(MOCK.sales).map(s=>({...s,itens:[],criadoPor:"mock"}));state.docs=structuredClone(MOCK.docs);
  saveLocal();
}
function saveLocal(){localStorage.setItem("erp_gestao_state",JSON.stringify({products:state.products,sales:state.sales,docs:state.docs}))}

async function loadFirestore(){
  const [p,s,d]=await Promise.all([getDocs(collection(db,"produtos")),getDocs(collection(db,"vendas")),getDocs(collection(db,"documentos"))]);
  state.products=p.docs.map(x=>({id:x.id,...x.data()}));
  state.sales=s.docs.map(x=>({id:x.id,...x.data()}));
  state.docs=d.docs.map(x=>({id:x.id,...x.data()}));
  if(!state.products.length && !state.sales.length && !state.docs.length) await seedFirebase();
}
async function seedFirebase(){
  const batch=writeBatch(db);
  MOCK.products.forEach(x=>batch.set(doc(db,"produtos",String(x.codigo)),x));
  MOCK.sales.forEach((x,i)=>batch.set(doc(db,"vendas",String(x.nota)+"-"+i),{...x,itens:[],criadoPor:"seed"}));
  MOCK.docs.forEach(x=>batch.set(doc(db,"documentos",String(x.id)),x));
  await batch.commit(); await loadFirestore(); toast("Banco Firebase populado com os dados da planilha.");
}

async function persistSale(sale,items){
  if(state.mode==="firebase"){
    const refs=items.map(i=>doc(db,"produtos",String(i.codigo)));
    await runTransaction(db,async tx=>{
      const snaps=[];
      for(const ref of refs) snaps.push(await tx.get(ref));
      snaps.forEach((snap,idx)=>{
        if(!snap.exists())throw new Error("Produto não encontrado.");
        const q=Number(snap.data().quantidade)||0, requested=Number(items[idx].quantidade)||0;
        if(q<requested)throw new Error(`Estoque insuficiente para ${snap.data().nome}. Disponível: ${q}.`);
      });
      snaps.forEach((snap,idx)=>{
        const q=Number(snap.data().quantidade)||0, requested=Number(items[idx].quantidade)||0;
        tx.update(refs[idx],{quantidade:q-requested});
      });
      tx.set(doc(db,"vendas",String(sale.nota)),sale);
    });
    await loadFirestore();
  }else{
    for(const i of items){const p=state.products.find(x=>String(x.codigo)===String(i.codigo));if(!p||p.quantidade<i.quantidade)throw new Error(`Estoque insuficiente para ${p?.nome||i.codigo}.`);p.quantidade-=i.quantidade}
    state.sales.push(sale);saveLocal();
  }
}
async function saveProduct(p,editing=false){
  if(state.mode==="firebase"){const b=writeBatch(db);b.set(doc(db,"produtos",String(p.codigo)),p);await b.commit();await loadFirestore()}
  else{const i=state.products.findIndex(x=>String(x.codigo)===String(p.codigo));if(i>=0)state.products[i]=p;else state.products.push(p);saveLocal()}
}
async function saveDocData(d){
  if(state.mode==="firebase"){const b=writeBatch(db);b.set(doc(db,"documentos",String(d.id)),d);await b.commit();await loadFirestore()}
  else{const i=state.docs.findIndex(x=>String(x.id)===String(d.id));if(i>=0)state.docs[i]=d;else state.docs.push(d);saveLocal()}
}
async function deleteProduct(codigo){
  if(state.mode==="firebase"){toast("Exclusão de produto não foi habilitada por segurança operacional. Edite para quantidade 0.");return}
  state.products=state.products.filter(x=>String(x.codigo)!==String(codigo));saveLocal();render()
}

function kpis(){
  const fatur=state.sales.reduce((a,x)=>a+Number(x.valor||0),0), qtd=state.sales.length, low=state.products.filter(p=>Number(p.quantidade)<=30).length;
  return {fatur,qtd,low,ticket:qtd?fatur/qtd:0,items:state.products.reduce((a,p)=>a+Number(p.quantidade||0),0)};
}
function render(){switch(state.page){case"dashboard":renderDashboard();break;case"sales":renderSales();break;case"stock":renderStock();break;case"docs":renderDocs()}renderIcons();document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.page===state.page));$("#pageTitle").textContent={dashboard:"Dashboard",sales:"Registro de Vendas",stock:"Gestão de Estoque",docs:"Controle Documental"}[state.page]}

function renderDashboard(){
 const k=kpis();
 $("#main").innerHTML=`
 <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
 ${kpi("Faturamento Total",money(k.fatur),"trending-up","text-emerald-600")}
 ${kpi("Quantidade de Vendas",k.qtd,"shopping-cart","text-blue-600")}
 ${kpi("Estoque Baixo",k.low,"triangle-alert","text-amber-600")}
 ${kpi("Ticket Médio",money(k.ticket),"receipt","text-violet-600")}
 </div>
 <div class="mt-4 grid gap-4 xl:grid-cols-3">
  <div class="card p-4 xl:col-span-2"><div class="mb-3 font-bold">Evolução do Faturamento</div><div class="h-72"><canvas id="salesEvolution"></canvas></div></div>
  <div class="card p-4"><div class="mb-3 font-bold">Vendas por Vendedor</div><div class="h-72"><canvas id="sellerChart"></canvas></div></div>
 </div>
 <div class="mt-4 grid gap-4 xl:grid-cols-3">
  <div class="card p-4"><div class="mb-3 font-bold">Produtos mais vendidos</div><div class="h-72"><canvas id="productChart"></canvas></div></div>
  <div class="card p-4 xl:col-span-2"><div class="mb-3 flex items-center justify-between"><div class="font-bold">Últimas vendas</div><button class="btn btn-muted" data-go="sales">Ver todas</button></div>${salesTable(state.sales.slice().sort((a,b)=>new Date(b.emissao)-new Date(a.emissao)).slice(0,8))}</div>
 </div>`;
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{state.page=b.dataset.go;render()});
 drawCharts();
}
function kpi(title,val,icon,cls){return `<div class="card p-4"><div class="flex items-center justify-between"><span class="text-sm font-semibold text-slate-500">${title}</span><span class="${cls}"><i data-lucide="${icon}"></i></span></div><div class="mt-3 text-2xl font-extrabold">${val}</div></div>`}
function destroyCharts(){Object.values(state.charts).forEach(c=>c?.destroy());state.charts={}}
function drawCharts(){
 destroyCharts(); const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};
 const sellers={};state.sales.forEach(s=>sellers[s.vendedor]=(sellers[s.vendedor]||0)+Number(s.valor||0));
 state.charts.seller=new Chart($("#sellerChart"),{type:"bar",data:{labels:Object.keys(sellers),datasets:[{data:Object.values(sellers),borderRadius:8}]},options:{...opts,scales:{y:{beginAtZero:true}}}});
 const months={};state.sales.forEach(s=>{const d=new Date(s.emissao),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;months[key]=(months[key]||0)+Number(s.valor||0)});
 const labels=Object.keys(months).sort();
 state.charts.evo=new Chart($("#salesEvolution"),{type:"line",data:{labels,datasets:[{label:"Faturamento",data:labels.map(x=>months[x]),tension:.35,fill:true}]},options:{...opts,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
 const prod={};state.sales.forEach(s=>(s.itens||[]).forEach(i=>prod[i.nome]=(prod[i.nome]||0)+Number(i.quantidade||0)));
 let top=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,8);
 if(!top.length) top=state.products.slice().sort((a,b)=>b.quantidade-a.quantidade).slice(0,8).map(p=>[p.nome,p.quantidade]);
 state.charts.product=new Chart($("#productChart"),{type:"doughnut",data:{labels:top.map(x=>x[0].slice(0,22)),datasets:[{data:top.map(x=>x[1])}]},options:{responsive:true,maintainAspectRatio:false}});
}
function salesTable(rows){return `<div class="overflow-auto scrollbar"><table class="table w-full text-sm"><thead><tr><th>Nota</th><th>Emissão</th><th>Vendedor</th><th class="text-right">Valor</th></tr></thead><tbody>${rows.map(s=>`<tr><td class="font-bold">#${esc(s.nota)}</td><td>${dateBR(s.emissao)}</td><td>${esc(s.vendedor)}</td><td class="text-right font-semibold">${money(s.valor)}</td></tr>`).join("")}</tbody></table></div>`}

function renderSales(){
 const sellers=[...new Set(state.sales.map(s=>s.vendedor).filter(Boolean))].sort();
 $("#main").innerHTML=`
 <div class="grid gap-4 xl:grid-cols-3">
  <div class="card p-5 xl:col-span-1">
   <div class="mb-4"><h2 class="font-extrabold">Nova venda</h2><p class="text-xs text-slate-500">A confirmação abate o estoque de forma transacional.</p></div>
   <form id="saleForm" class="space-y-3">
    <div class="grid grid-cols-2 gap-3"><div><label class="mb-1 block text-xs font-bold">Nota Fiscal</label><input id="saleNota" class="field" type="number" required value="${nextNota()}"></div><div><label class="mb-1 block text-xs font-bold">Emissão</label><input id="saleDate" class="field" type="datetime-local" required value="${nowLocal()}"></div></div>
    <div><label class="mb-1 block text-xs font-bold">Vendedor</label><select id="saleSeller" class="field">${(state.user?.email?[state.user.email]:sellers.length?sellers:["Vendedor"]).map(x=>`<option>${esc(x)}</option>`).join("")}</select></div>
    <div id="saleItems"></div>
    <button type="button" id="addItem" class="btn btn-muted w-full"><i data-lucide="plus"></i> Adicionar produto</button>
    <div class="rounded-xl bg-slate-100 p-4 dark:bg-slate-800"><div class="flex justify-between text-sm"><span>Total</span><strong id="saleTotal">${money(0)}</strong></div></div>
    <button class="btn btn-primary w-full" type="submit"><i data-lucide="check"></i> Confirmar venda</button>
   </form>
  </div>
  <div class="card p-5 xl:col-span-2">
   <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div><h2 class="font-extrabold">Histórico de vendas</h2><p class="text-xs text-slate-500">${state.sales.length} notas cadastradas</p></div><input id="saleSearch" class="field sm:max-w-xs" placeholder="Buscar nota ou vendedor..."></div>
   <div id="salesList"></div>
  </div>
 </div>`;
 addSaleItem();$("#addItem").onclick=addSaleItem;$("#saleForm").onsubmit=submitSale;$("#saleSearch").oninput=e=>renderSalesList(e.target.value);renderSalesList();renderIcons();
}
function nextNota(){return Math.max(1000,...state.sales.map(s=>Number(s.nota)||0))+1}
function addSaleItem(){
 const wrap=$("#saleItems"), div=document.createElement("div");div.className="sale-item mb-3 rounded-xl border border-slate-200 p-3 dark:border-slate-700";
 div.innerHTML=`<div class="grid grid-cols-[1fr_90px_auto] gap-2"><select class="product-select field">${state.products.map(p=>`<option value="${esc(p.codigo)}">${esc(p.codigo)} • ${esc(p.nome.slice(0,40))} — ${money(p.preco)}</option>`).join("")}</select><input class="qty field" type="number" min="1" value="1"><button type="button" class="remove-item btn btn-muted" title="Remover"><i data-lucide="trash-2"></i></button></div>`;
 div.querySelector(".remove-item").onclick=()=>{if(document.querySelectorAll(".sale-item").length>1)div.remove();calcSale()};
 div.querySelectorAll("select,input").forEach(x=>x.oninput=calcSale);wrap.appendChild(div);calcSale();renderIcons();
}
function calcSale(){let total=0;document.querySelectorAll(".sale-item").forEach(r=>{const p=state.products.find(x=>String(x.codigo)===r.querySelector(".product-select").value);total+=(p?.preco||0)*Number(r.querySelector(".qty").value||0)});$("#saleTotal").textContent=money(total);return total}
async function submitSale(e){
 e.preventDefault();const items=[...document.querySelectorAll(".sale-item")].map(r=>{const p=state.products.find(x=>String(x.codigo)===r.querySelector(".product-select").value);return{codigo:p.codigo,nome:p.nome,quantidade:Number(r.querySelector(".qty").value),preco:Number(p.preco)}});const total=items.reduce((a,i)=>a+i.preco*i.quantidade,0);
 if(items.some(i=>!i.quantidade||i.quantidade<1))return toast("Informe quantidades válidas.","error");
 const sale={nota:Number($("#saleNota").value),emissao:new Date($("#saleDate").value).toISOString(),vendedor:$("#saleSeller").value,valor:total,itens,criadoPor:state.user?.email||"local"};
 try{await persistSale(sale,items);toast("Venda registrada e estoque atualizado.");render()}catch(err){console.error(err);toast(err.message||"Não foi possível registrar a venda.","error")}
}
function renderSalesList(term=""){const t=(term||"").toLowerCase();const rows=state.sales.slice().sort((a,b)=>new Date(b.emissao)-new Date(a.emissao)).filter(s=>String(s.nota).includes(t)||String(s.vendedor).toLowerCase().includes(t));$("#salesList").innerHTML=salesTable(rows)}
function renderStock(){
 $("#main").innerHTML=`
 <div class="card p-5"><div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between"><div><h2 class="font-extrabold">Produtos e estoque</h2><p class="text-xs text-slate-500">${state.products.length} produtos • ${kpis().items} itens físicos</p></div><button id="newProduct" class="btn btn-primary"><i data-lucide="plus"></i> Novo produto</button></div>
 <div class="mb-4"><input id="stockSearch" class="field max-w-lg" placeholder="Buscar por código ou nome..."></div><div id="stockList"></div></div>`;
 $("#newProduct").onclick=()=>productModal();$("#stockSearch").oninput=e=>renderStockList(e.target.value);renderStockList();renderIcons();
}
function renderStockList(term=""){const t=term.toLowerCase();const rows=state.products.filter(p=>String(p.codigo).includes(t)||p.nome.toLowerCase().includes(t));$("#stockList").innerHTML=`<div class="overflow-auto scrollbar"><table class="table w-full text-sm"><thead><tr><th>Código</th><th>Produto</th><th>Quantidade</th><th>Preço</th><th>Valor Total</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(p=>{const low=p.quantidade<=30;return `<tr><td class="font-bold">${p.codigo}</td><td>${esc(p.nome)}</td><td class="font-bold">${p.quantidade}</td><td>${money(p.preco)}</td><td>${money(p.quantidade*p.preco)}</td><td><span class="rounded-full px-2 py-1 text-xs font-bold ${low?"bg-amber-100 text-amber-700":"bg-emerald-100 text-emerald-700"}">${low?"Baixo":"Normal"}</span></td><td><button class="edit-prod btn btn-muted" data-id="${p.codigo}"><i data-lucide="pencil"></i></button></td></tr>`}).join("")}</tbody></table></div>`;document.querySelectorAll(".edit-prod").forEach(b=>b.onclick=()=>productModal(state.products.find(p=>String(p.codigo)===b.dataset.id)));renderIcons()}
function productModal(p=null){
 const modal=document.createElement("div");modal.className="fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";modal.innerHTML=`<div class="card w-full max-w-lg p-5"><div class="mb-4 flex justify-between"><h2 class="font-extrabold">${p?"Editar produto":"Novo produto"}</h2><button class="close btn btn-muted"><i data-lucide="x"></i></button></div><form class="space-y-3"><div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold">Código</label><input id="pCode" class="field" type="number" required value="${p?.codigo??(Math.max(0,...state.products.map(x=>x.codigo))+1)}" ${p?"readonly":""}></div><div><label class="text-xs font-bold">Quantidade</label><input id="pQty" class="field" type="number" min="0" required value="${p?.quantidade??0}"></div></div><div><label class="text-xs font-bold">Nome</label><input id="pName" class="field" required value="${esc(p?.nome||"")}"></div><div><label class="text-xs font-bold">Preço unitário</label><input id="pPrice" class="field" type="number" min="0" step="0.01" required value="${p?.preco??0}"></div><button class="btn btn-primary w-full">Salvar</button></form></div>`;document.body.appendChild(modal);modal.querySelector(".close").onclick=()=>modal.remove();modal.querySelector("form").onsubmit=async e=>{e.preventDefault();const x={codigo:Number($("#pCode").value),nome:$("#pName").value.trim(),quantidade:Number($("#pQty").value),preco:Number($("#pPrice").value)};if(!x.nome)return;await saveProduct(x,!!p);modal.remove();toast("Produto salvo.");render()};renderIcons();
}
function renderDocs(){
 $("#main").innerHTML=`<div class="card p-5"><div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between"><div><h2 class="font-extrabold">Documentação</h2><p class="text-xs text-slate-500">${state.docs.filter(d=>d.status==="Pendente").length} pendentes</p></div><button id="newDoc" class="btn btn-primary"><i data-lucide="plus"></i> Novo documento</button></div><div class="mb-4"><input id="docSearch" class="field max-w-lg" placeholder="Buscar documento, tipo ou status..."></div><div id="docList"></div></div>`;
 $("#newDoc").onclick=()=>docModal();$("#docSearch").oninput=e=>renderDocsList(e.target.value);renderDocsList();renderIcons();
}
function renderDocsList(term=""){const t=term.toLowerCase();const rows=state.docs.filter(d=>[d.id,d.nome,d.tipo,d.status].some(x=>String(x).toLowerCase().includes(t)));$("#docList").innerHTML=`<div class="overflow-auto scrollbar"><table class="table w-full text-sm"><thead><tr><th>ID</th><th>Documento</th><th>Tipo</th><th>Emissão</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(d=>`<tr><td class="font-bold">${d.id}</td><td>${esc(d.nome)}</td><td>${esc(d.tipo)}</td><td>${dateBR(d.emissao)}</td><td><select class="doc-status field max-w-40" data-id="${d.id}">${["Pendente","Aprovado","Arquivado","Concluído"].map(s=>`<option ${d.status===s?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="edit-doc btn btn-muted" data-id="${d.id}"><i data-lucide="pencil"></i></button></td></tr>`).join("")}</tbody></table></div>`;document.querySelectorAll(".doc-status").forEach(s=>s.onchange=async()=>{const d=state.docs.find(x=>String(x.id)===s.dataset.id);d.status=s.value;await saveDocData(d);toast("Status atualizado.")});document.querySelectorAll(".edit-doc").forEach(b=>b.onclick=()=>docModal(state.docs.find(d=>String(d.id)===b.dataset.id)));renderIcons()}
function docModal(d=null){
 const m=document.createElement("div");m.className="fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/60 p-4";m.innerHTML=`<div class="card w-full max-w-lg p-5"><div class="mb-4 flex justify-between"><h2 class="font-extrabold">${d?"Editar documento":"Novo documento"}</h2><button class="close btn btn-muted"><i data-lucide="x"></i></button></div><form class="space-y-3"><div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold">ID Doc</label><input id="dId" class="field" type="number" required value="${d?.id??(Math.max(0,...state.docs.map(x=>x.id))+1)}" ${d?"readonly":""}></div><div><label class="text-xs font-bold">Data de emissão</label><input id="dDate" class="field" type="date" required value="${d?.emissao||new Date().toISOString().slice(0,10)}"></div></div><div><label class="text-xs font-bold">Nome do documento</label><input id="dName" class="field" required value="${esc(d?.nome||"")}"></div><div><label class="text-xs font-bold">Tipo</label><input id="dType" class="field" required value="${esc(d?.tipo||"")}"></div><div><label class="text-xs font-bold">Status</label><select id="dStatus" class="field">${["Pendente","Aprovado","Arquivado","Concluído"].map(s=>`<option ${d?.status===s?"selected":""}>${s}</option>`).join("")}</select></div><button class="btn btn-primary w-full">Salvar</button></form></div>`;document.body.appendChild(m);m.querySelector(".close").onclick=()=>m.remove();m.querySelector("form").onsubmit=async e=>{e.preventDefault();await saveDocData({id:Number($("#dId").value),nome:$("#dName").value.trim(),tipo:$("#dType").value.trim(),emissao:$("#dDate").value,status:$("#dStatus").value});m.remove();toast("Documento salvo.");render()};renderIcons()
}

function exportXLSX(){
 const fatur=state.sales.reduce((a,x)=>a+Number(x.valor||0),0), low=state.products.filter(p=>p.quantidade<=30).length, totalItems=state.products.reduce((a,p)=>a+p.quantidade,0), pend=state.docs.filter(d=>d.status==="Pendente").length;
 const menu=[["PAINÉIS E INDICADORES ADMINISTRATIVOS"],[],["Indicador","Valor"],["Faturamento Total",fatur],["Quantidade de Vendas",state.sales.length],["Total de Itens em Estoque",totalItems],["Itens em Estoque Baixo",low],["Ticket Médio",state.sales.length?fatur/state.sales.length:0],["Documentos Pendentes",pend]];
 const fin=[["CONTROLE FINANCEIRO"],[],["Nota","Emissão","Vendedor","Valor"],...state.sales.map(s=>[s.nota,new Date(s.emissao),s.vendedor,s.valor])];
 const est=[["CONTROLE DE ESTOQUE"],[],["Cód Produto","Nome do Produto","Quantidade","Preço Unitário","Valor Total"],...state.products.map(p=>[p.codigo,p.nome,p.quantidade,p.preco,p.quantidade*p.preco])];
 const doc=[["CONTROLE DOCUMENTAL"],[],["ID Doc","Nome do Documento","Tipo","Data de Emissão","Status"],...state.docs.map(d=>[d.id,d.nome,d.tipo,new Date(d.emissao),d.status])];
 const wb2=XLSX.utils.book_new();[["MENU",menu],["Financeiro",fin],["Estoque",est],["Documentação",doc]].forEach(([n,a])=>{const ws=XLSX.utils.aoa_to_sheet(a);ws["!cols"]=a[0].map(()=>({wch:24}));XLSX.utils.book_append_sheet(wb2,ws,n)});
 XLSX.writeFile(wb2,"projeto_erp.xlsx");toast("XLSX exportado com 4 abas.")
}

async function login(e){
 e.preventDefault();const email=$("#loginEmail").value.trim(),pass=$("#loginPassword").value;
 if(state.mode==="firebase"){try{await signInWithEmailAndPassword(auth,email,pass)}catch(err){toast("Falha no login: "+err.message,"error")}}
 else{state.user={email};$("#loginScreen").classList.add("hidden");$("#app").classList.remove("hidden");$("#userName").textContent=email;render()}
}
async function logout(){if(state.mode==="firebase")await signOut(auth);else{state.user=null;$("#app").classList.add("hidden");$("#loginScreen").classList.remove("hidden");$("#loginScreen").classList.add("flex")}}
async function populate(){
 if(state.mode==="firebase"){await seedFirebase()}else{state.products=structuredClone(MOCK.products);state.sales=structuredClone(MOCK.sales).map(s=>({...s,itens:[]}));state.docs=structuredClone(MOCK.docs);saveLocal();render();toast("Dados de exemplo restaurados.")}
}
$("#loginForm").onsubmit=login;$("#logoutBtn").onclick=logout;$("#seedBtn").onclick=populate;$("#exportBtnSide").onclick=exportXLSX;
document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;$("#sidebar").classList.add("-translate-x-full");render()});
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("-translate-x-full");
$("#themeBtn").onclick=()=>{document.documentElement.classList.toggle("dark");localStorage.setItem("erp_dark",document.documentElement.classList.contains("dark")?"1":"0")};
if(localStorage.getItem("erp_dark")==="1")document.documentElement.classList.add("dark");
init();
</script>
</body>
</html>
